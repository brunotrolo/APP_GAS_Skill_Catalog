<script>
  var allSkills = [];
  var activeTags = new Set();
  var lastFetchedMetadata = null;
  var activeTipo = 'ALL';
  var activeSort = 'nome_asc';

  var SORT_COMPARATORS = {
    nome_asc: function (a, b) { return (a.nome || '').localeCompare(b.nome || ''); },
    nome_desc: function (a, b) { return (b.nome || '').localeCompare(a.nome || ''); },
    data_desc: function (a, b) { return new Date(b.data_registro) - new Date(a.data_registro); },
    data_asc: function (a, b) { return new Date(a.data_registro) - new Date(b.data_registro); },
    autor_asc: function (a, b) { return (a.autor || '').localeCompare(b.autor || ''); }
  };

  var ERROR_MESSAGES = {
    INVALID_URL: 'Essa URL nao parece ser de um repositorio do GitHub.',
    PRIVATE_OR_NOT_FOUND: 'Repositorio nao encontrado ou privado. Se for privado, configure GITHUB_TOKEN.',
    PRIVATE_REPO_NO_ACCESS: 'Sem acesso a este repositorio privado.',
    RATE_LIMITED: 'Limite de requisicoes do GitHub atingido. Tente novamente mais tarde.',
    GITHUB_API_ERROR: 'Erro inesperado ao consultar o GitHub.',
    INVALID_PAYLOAD: 'Preencha tipo e categoria antes de salvar.',
    MISSING_SPREADSHEET_ID: 'Configuracao pendente: SPREADSHEET_ID nao definido.',
    UNKNOWN_ERROR: 'Erro inesperado. Tente novamente.'
  };

  function friendlyMessage(result) {
    return (result && result.message) || ERROR_MESSAGES[result && result.errorCode] || ERROR_MESSAGES.UNKNOWN_ERROR;
  }

  document.addEventListener('DOMContentLoaded', function () {
    google.script.run.withSuccessHandler(onSkillsLoaded).withFailureHandler(onLoadFailure).getSkills();
    google.script.run.withSuccessHandler(onCategoriasLoaded).withFailureHandler(onLoadFailure).getCategoriasList();
    wireSidebarNav();
    initTheme();
    wireModuleNav();
  });

  // ---- Navegacao entre modulos (paginas independentes) ----

  var MODULE_VIEWS_LOADED = {};

  function wireModuleNav() {
    var items = document.querySelectorAll('.module-nav-item');
    items.forEach(function (item) {
      item.onclick = function () {
        items.forEach(function (i) { i.classList.remove('active'); });
        item.classList.add('active');
        switchView(item.dataset.view);
      };
    });
  }

  function switchView(viewId) {
    document.querySelectorAll('.app-view').forEach(function (view) {
      view.classList.remove('active');
    });
    var target = document.getElementById('view-' + viewId);
    if (target) target.classList.add('active');

    if (!MODULE_VIEWS_LOADED[viewId]) {
      MODULE_VIEWS_LOADED[viewId] = true;
      loadModuleView(viewId);
    }
  }

  function loadModuleView(viewId) {
    var loaders = {
      archive: loadOdinDocs,
      oracle: loadOracleItems,
      radar: loadCommunityRadar,
      prompts: loadGoldenPrompts,
      fame: loadWallOfFame,
      board: loadRequestBoard,
      airadar: loadAiRadarItems
    };
    if (loaders[viewId]) loaders[viewId]();
  }

  function renderModuleList(containerId, items, emptyMessage, itemRenderer) {
    var container = document.getElementById(containerId);
    container.innerHTML = '';
    if (!items || items.length === 0) {
      container.innerHTML = '<div class="empty-state">' + emptyMessage + '</div>';
      return;
    }
    items.forEach(function (item) {
      var div = document.createElement('div');
      div.className = 'module-item';
      div.innerHTML = itemRenderer(item);
      container.appendChild(div);
    });
  }

  function formatModuleDate(iso) {
    if (!iso) return '';
    var date = new Date(iso);
    return isNaN(date.getTime()) ? '' : date.toLocaleDateString('pt-BR');
  }

  // ---- Odin Archive ----

  function loadOdinDocs() {
    google.script.run.withSuccessHandler(function (result) {
      if (!result.success) { showToast(friendlyMessage(result), 'error'); return; }
      renderModuleList('archiveList', result.data, 'NENHUM TOMO REGISTRADO AINDA', function (doc) {
        return '<h3>' + escapeHtml(doc.titulo) + '</h3>' +
          (doc.categoria ? '<div class="module-meta">' + escapeHtml(doc.categoria) + '</div>' : '') +
          '<p>' + escapeHtml(doc.resumo || '') + '</p>' +
          '<div class="module-actions"><a class="pixel-button secondary" href="' + escapeHtml(doc.conteudo_url) + '" target="_blank">ABRIR</a></div>';
      });
    }).withFailureHandler(onLoadFailure).getOdinDocs();
  }

  function submitOdinDoc(event) {
    event.preventDefault();
    var payload = {
      titulo: document.getElementById('archiveTitulo').value.trim(),
      categoria: document.getElementById('archiveCategoria').value.trim(),
      conteudo_url: document.getElementById('archiveUrl').value.trim(),
      resumo: document.getElementById('archiveResumo').value.trim()
    };
    google.script.run.withSuccessHandler(function (result) {
      if (!result.success) { showToast(friendlyMessage(result), 'error'); return; }
      showToast('Tomo adicionado!', 'success');
      event.target.reset();
      loadOdinDocs();
    }).withFailureHandler(onLoadFailure).addOdinDoc(payload);
    return false;
  }

  // ---- Oracle Weekly ----

  function loadOracleItems() {
    google.script.run.withSuccessHandler(function (result) {
      if (!result.success) { showToast(friendlyMessage(result), 'error'); return; }
      renderModuleList('oracleList', result.data, 'NENHUM ACHADO AINDA', function (item) {
        return '<h3>' + escapeHtml(item.titulo) + '</h3>' +
          '<div class="module-meta">' + escapeHtml(item.fonte || '') + ' · ' + formatModuleDate(item.data) + '</div>' +
          '<p>' + escapeHtml(item.resumo || '') + '</p>' +
          '<div class="module-actions"><a class="pixel-button secondary" href="' + escapeHtml(item.url) + '" target="_blank">LER</a></div>';
      });
    }).withFailureHandler(onLoadFailure).getOracleItems();
  }

  function submitOracleItem(event) {
    event.preventDefault();
    var payload = {
      titulo: document.getElementById('oracleTitulo').value.trim(),
      url: document.getElementById('oracleUrl').value.trim(),
      fonte: document.getElementById('oracleFonte').value.trim(),
      resumo: document.getElementById('oracleResumo').value.trim()
    };
    google.script.run.withSuccessHandler(function (result) {
      if (!result.success) { showToast(friendlyMessage(result), 'error'); return; }
      showToast('Achado adicionado!', 'success');
      event.target.reset();
      loadOracleItems();
    }).withFailureHandler(onLoadFailure).addOracleItem(payload);
    return false;
  }

  // ---- Community Radar ----

  function loadCommunityRadar() {
    google.script.run.withSuccessHandler(function (result) {
      if (!result.success) { showToast(friendlyMessage(result), 'error'); return; }
      renderModuleList('radarList', result.data, 'NENHUMA SUGESTAO AINDA', function (item) {
        return '<h3>' + escapeHtml(item.nome_ferramenta) + '</h3>' +
          '<p>' + escapeHtml(item.descricao || '') + '</p>' +
          '<div class="module-meta">sugerido por ' + escapeHtml(item.sugerido_por || '') + '</div>' +
          '<div class="module-actions">' +
          '<a class="pixel-button secondary" href="' + escapeHtml(item.url) + '" target="_blank">VER</a>' +
          '<button class="pixel-button" data-upvote="' + escapeHtml(item.id) + '">👍 ' + (Number(item.votos) || 0) + '</button>' +
          '</div>';
      });
      document.querySelectorAll('#radarList [data-upvote]').forEach(function (btn) {
        btn.onclick = function () {
          google.script.run.withSuccessHandler(function () { loadCommunityRadar(); })
            .withFailureHandler(onLoadFailure).upvoteCommunityTool(btn.dataset.upvote);
        };
      });
    }).withFailureHandler(onLoadFailure).getCommunityRadarItems();
  }

  function submitRadarItem(event) {
    event.preventDefault();
    var payload = {
      nome_ferramenta: document.getElementById('radarNome').value.trim(),
      url: document.getElementById('radarUrl').value.trim(),
      descricao: document.getElementById('radarDescricao').value.trim()
    };
    google.script.run.withSuccessHandler(function (result) {
      if (!result.success) { showToast(friendlyMessage(result), 'error'); return; }
      showToast('Ferramenta sugerida!', 'success');
      event.target.reset();
      loadCommunityRadar();
    }).withFailureHandler(onLoadFailure).suggestCommunityTool(payload);
    return false;
  }

  // ---- Golden Prompts ----

  function loadGoldenPrompts() {
    google.script.run.withSuccessHandler(function (result) {
      if (!result.success) { showToast(friendlyMessage(result), 'error'); return; }
      renderModuleList('promptsList', result.data, 'NENHUM PROMPT AINDA', function (item) {
        return '<h3>' + escapeHtml(item.titulo) + '</h3>' +
          (item.categoria ? '<div class="module-meta">' + escapeHtml(item.categoria) + '</div>' : '') +
          '<div class="preview-box">' + escapeHtml(item.prompt_texto) + '</div>' +
          '<div class="module-actions"><button class="pixel-button secondary" data-copy-prompt="' + escapeHtml(item.id) + '">COPIAR</button></div>';
      });
      document.querySelectorAll('#promptsList [data-copy-prompt]').forEach(function (btn) {
        btn.onclick = function () {
          var promptBox = btn.closest('.module-item').querySelector('.preview-box');
          copyToClipboard(promptBox.textContent);
          google.script.run.withFailureHandler(function () {}).registerPromptUse(btn.dataset.copyPrompt);
        };
      });
    }).withFailureHandler(onLoadFailure).getGoldenPrompts();
  }

  function submitGoldenPrompt(event) {
    event.preventDefault();
    var payload = {
      titulo: document.getElementById('promptTitulo').value.trim(),
      prompt_texto: document.getElementById('promptTexto').value.trim(),
      variaveis: document.getElementById('promptVariaveis').value.trim(),
      categoria: document.getElementById('promptCategoria').value.trim()
    };
    google.script.run.withSuccessHandler(function (result) {
      if (!result.success) { showToast(friendlyMessage(result), 'error'); return; }
      showToast('Prompt adicionado!', 'success');
      event.target.reset();
      loadGoldenPrompts();
    }).withFailureHandler(onLoadFailure).addGoldenPrompt(payload);
    return false;
  }

  // ---- Sandbox ----

  function submitSandboxPrompt(event) {
    event.preventDefault();
    var btn = document.getElementById('sandboxSubmitBtn');
    var output = document.getElementById('sandboxOutput');
    var payload = {
      skillNome: document.getElementById('sandboxSkillNome').value.trim(),
      inputTexto: document.getElementById('sandboxInput').value.trim()
    };
    btn.disabled = true;
    btn.textContent = 'RODANDO...';
    google.script.run.withSuccessHandler(function (result) {
      btn.disabled = false;
      btn.textContent = '▶️ RODAR TESTE';
      output.style.display = 'block';
      if (!result.success) {
        output.textContent = friendlyMessage(result);
        return;
      }
      output.textContent = result.data.outputTexto;
    }).withFailureHandler(function (err) {
      btn.disabled = false;
      btn.textContent = '▶️ RODAR TESTE';
      output.style.display = 'block';
      output.textContent = err && err.message ? err.message : 'Erro ao rodar o sandbox.';
    }).runSandboxPrompt(payload);
    return false;
  }

  // ---- Wall of Fame ----

  function loadWallOfFame() {
    google.script.run.withSuccessHandler(function (result) {
      if (!result.success) { showToast(friendlyMessage(result), 'error'); return; }
      renderModuleList('fameList', result.data, 'NENHUM IMPACTO REGISTRADO AINDA', function (item) {
        return '<h3>' + escapeHtml(item.skill_nome) + '</h3>' +
          (item.time ? '<div class="module-meta">' + escapeHtml(item.time) + '</div>' : '') +
          '<p>' + escapeHtml(item.impacto) + '</p>';
      });
    }).withFailureHandler(onLoadFailure).getWallOfFameEntries();
  }

  function submitFameEntry(event) {
    event.preventDefault();
    var payload = {
      skill_nome: document.getElementById('fameSkillNome').value.trim(),
      time: document.getElementById('fameTime').value.trim(),
      impacto: document.getElementById('fameImpacto').value.trim()
    };
    google.script.run.withSuccessHandler(function (result) {
      if (!result.success) { showToast(friendlyMessage(result), 'error'); return; }
      showToast('Impacto registrado!', 'success');
      event.target.reset();
      loadWallOfFame();
    }).withFailureHandler(onLoadFailure).addWallOfFameEntry(payload);
    return false;
  }

  // ---- Odin Request Board ----

  function loadRequestBoard() {
    google.script.run.withSuccessHandler(function (result) {
      if (!result.success) { showToast(friendlyMessage(result), 'error'); return; }
      renderModuleList('boardList', result.data, 'NENHUMA MISSAO ABERTA', function (item) {
        return '<h3>' + escapeHtml(item.titulo) + '</h3>' +
          '<p>' + escapeHtml(item.descricao || '') + '</p>' +
          '<div class="module-meta">' + escapeHtml(item.status) + ' · pedido por ' + escapeHtml(item.solicitante || '') + '</div>' +
          '<div class="module-actions"><button class="pixel-button" data-upvote-board="' + escapeHtml(item.id) + '">👍 ' + (Number(item.votos) || 0) + '</button></div>';
      });
      document.querySelectorAll('#boardList [data-upvote-board]').forEach(function (btn) {
        btn.onclick = function () {
          google.script.run.withSuccessHandler(function () { loadRequestBoard(); })
            .withFailureHandler(onLoadFailure).upvoteRequestBoardItem(btn.dataset.upvoteBoard);
        };
      });
    }).withFailureHandler(onLoadFailure).getRequestBoardItems();
  }

  function submitBoardItem(event) {
    event.preventDefault();
    var payload = {
      titulo: document.getElementById('boardTitulo').value.trim(),
      descricao: document.getElementById('boardDescricao').value.trim()
    };
    google.script.run.withSuccessHandler(function (result) {
      if (!result.success) { showToast(friendlyMessage(result), 'error'); return; }
      showToast('Missao aberta!', 'success');
      event.target.reset();
      loadRequestBoard();
    }).withFailureHandler(onLoadFailure).addRequestBoardItem(payload);
    return false;
  }

  // ---- AI Tech Radar ----

  function loadAiRadarItems() {
    google.script.run.withSuccessHandler(function (result) {
      if (!result.success) { showToast(friendlyMessage(result), 'error'); return; }
      renderModuleList('airadarList', result.data, 'NENHUMA TECNOLOGIA CLASSIFICADA AINDA', function (item) {
        var quadClass = 'q-' + String(item.quadrante || '').toLowerCase();
        var categoriaLabel = String(item.categoria_blip || '').replace('_', ' & ');
        return '<span class="quadrant-badge ' + quadClass + '">' + escapeHtml(item.quadrante) + '</span>' +
          '<h3>' + escapeHtml(item.nome) + '</h3>' +
          (categoriaLabel ? '<div class="module-meta">' + escapeHtml(categoriaLabel) + '</div>' : '') +
          '<p>' + escapeHtml(item.descricao || '') + '</p>';
      });
    }).withFailureHandler(onLoadFailure).getAiRadarItems();
  }

  function submitAiRadarItem(event) {
    event.preventDefault();
    var payload = {
      nome: document.getElementById('airadarNome').value.trim(),
      quadrante: document.getElementById('airadarQuadrante').value,
      categoria_blip: document.getElementById('airadarCategoriaBlip').value,
      descricao: document.getElementById('airadarDescricao').value.trim()
    };
    google.script.run.withSuccessHandler(function (result) {
      if (!result.success) { showToast(friendlyMessage(result), 'error'); return; }
      showToast('Tecnologia classificada!', 'success');
      event.target.reset();
      loadAiRadarItems();
    }).withFailureHandler(onLoadFailure).addAiRadarItem(payload);
    return false;
  }

  // ---- Motor de temas (design system em tempo real) ----
  // Cada tema e um conjunto de CSS custom properties aplicado diretamente via
  // style inline em <html> (document.documentElement.style.setProperty), o que
  // permite trocar em tempo real sem reload e sem precisar de um bloco CSS
  // estatico por tema. Novos temas vem de arquivos Markdown em docs/themes/
  // (ver docs/themes/README.md) traduzidos manualmente para uma entrada aqui.
  // Cada tema pode trazer suas proprias fontes (--font-heading/--font-body/
  // --font-display); quando ausentes, cai no fallback do dark (ver :root em
  // Stylesheet.html). Fontes proprietarias citadas nas specs de docs/themes/
  // (SF Pro, BMW Type Next, Berkeley Mono) nao sao redistribuiveis via Google
  // Fonts, entao usamos pilhas de fontes de sistema/livres com o mesmo espirito.
  // Alem de cores/fontes, cada tema controla a "forma" dos componentes:
  // raio de borda, espessura de borda, sombra (chunky pixel-art vs chata/sem
  // sombra), tracking/caixa dos titulos e se superficies usam gradiente
  // (estetica pixel-art) ou cor solida (design flat). Isso e o que faz Apple
  // e OpenCode parecerem genuinamente diferentes um do outro, nao so a cor.
  var THEMES = {
    dark: {
      label: '🌙 Escuro (padrao)',
      vars: {
        '--bg-deep': '#0a0b16', '--bg-panel': '#181a2c', '--bg-card': '#1d2037',
        '--bg-card-hover': '#262a47', '--border-ink': '#000000', '--text-main': '#f3f4fc',
        '--gold': '#ffd84a', '--gold-glow': '#ffe98a', '--purple': '#b06aed',
        '--terminal-green': '#2effa0', '--danger': '#ff5d6c', '--muted': '#b7b9d8',
        '--font-heading': "'Pixelify Sans', monospace", '--font-body': "'Space Mono', monospace",
        '--font-display': "'Press Start 2P', monospace",
        '--radius-s': '6px', '--radius-m': '10px', '--border-width': '2px',
        '--shadow-chunky': '4px 6px 0px #000', '--letter-spacing-heading': '0.5px',
        '--heading-transform': 'none', '--on-accent': '#231a00',
        '--chrome-gradient': 'linear-gradient(180deg, var(--bg-card-hover), var(--bg-card))',
        '--chrome-gradient-accent': 'linear-gradient(180deg, var(--gold-glow), var(--gold))',
        '--chrome-gradient-card': 'linear-gradient(165deg, var(--bg-card-hover) 0%, var(--bg-card) 60%)',
        '--chrome-gradient-panel': 'linear-gradient(165deg, var(--bg-card-hover), var(--bg-panel) 45%)'
      }
    },
    light: {
      label: '☀️ Claro',
      vars: {
        '--bg-deep': '#eef0fb', '--bg-panel': '#ffffff', '--bg-card': '#f6f7ff',
        '--bg-card-hover': '#e9ebfb', '--border-ink': '#1b1d2e', '--text-main': '#1b1d2e',
        '--gold': '#c98f00', '--gold-glow': '#e8b23a', '--purple': '#8a3fd6',
        '--terminal-green': '#0f9d64', '--danger': '#c92a3a', '--muted': '#51546f',
        '--font-heading': "'Pixelify Sans', monospace", '--font-body': "'Space Mono', monospace",
        '--font-display': "'Press Start 2P', monospace",
        '--radius-s': '6px', '--radius-m': '10px', '--border-width': '2px',
        '--shadow-chunky': '4px 6px 0px #000', '--letter-spacing-heading': '0.5px',
        '--heading-transform': 'none', '--on-accent': '#231a00',
        '--chrome-gradient': 'linear-gradient(180deg, var(--bg-card-hover), var(--bg-card))',
        '--chrome-gradient-accent': 'linear-gradient(180deg, var(--gold-glow), var(--gold))',
        '--chrome-gradient-card': 'linear-gradient(165deg, var(--bg-card-hover) 0%, var(--bg-card) 60%)',
        '--chrome-gradient-panel': 'linear-gradient(165deg, var(--bg-card-hover), var(--bg-panel) 45%)'
      }
    },
    apple: {
      // De docs/themes/DESIGN-apple.md: canvas branco, Action Blue como unica
      // cor de interacao, "sem gradientes decorativos, sem sombras no chrome",
      // cantos generosamente arredondados, tracking negativo nos titulos.
      label: '🍎 Apple',
      vars: {
        '--bg-deep': '#ffffff', '--bg-panel': '#fafafc', '--bg-card': '#f5f5f7',
        '--bg-card-hover': '#f0f0f0', '--border-ink': '#1d1d1f', '--text-main': '#1d1d1f',
        '--gold': '#0066cc', '--gold-glow': '#2997ff', '--purple': '#5e5ce6',
        '--terminal-green': '#34c759', '--danger': '#ff3b30', '--muted': '#7a7a7a',
        '--font-heading': "-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif",
        '--font-body': "-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif",
        '--font-display': "-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif",
        '--radius-s': '10px', '--radius-m': '18px', '--border-width': '1px',
        '--shadow-chunky': 'none', '--letter-spacing-heading': '-0.4px',
        '--heading-transform': 'none', '--on-accent': '#ffffff',
        '--chrome-gradient': 'var(--bg-card)', '--chrome-gradient-accent': 'var(--gold)',
        '--chrome-gradient-card': 'var(--bg-card)', '--chrome-gradient-panel': 'var(--bg-panel)'
      }
    },
    bmw: {
      // De docs/themes/DESIGN-bmw-m.md: canvas quase preto, texto branco,
      // acentos motorsport (vermelho M), titulos em UPPERCASE confiante,
      // cantos quase retos, sem gradientes decorativos.
      label: '🏁 BMW M',
      vars: {
        '--bg-deep': '#000000', '--bg-panel': '#0d0d0d', '--bg-card': '#1a1a1a',
        '--bg-card-hover': '#262626', '--border-ink': '#3c3c3c', '--text-main': '#ffffff',
        '--gold': '#e22718', '--gold-glow': '#ff6a52', '--purple': '#1c69d4',
        '--terminal-green': '#0fa336', '--danger': '#e22718', '--muted': '#7e7e7e',
        '--font-heading': "'Arial Black', Arial, sans-serif",
        '--font-body': "Helvetica, Arial, sans-serif",
        '--font-display': "'Arial Black', Arial, sans-serif",
        '--radius-s': '2px', '--radius-m': '4px', '--border-width': '1px',
        '--shadow-chunky': 'none', '--letter-spacing-heading': '0px',
        '--heading-transform': 'uppercase', '--on-accent': '#ffffff',
        '--chrome-gradient': 'var(--bg-card)', '--chrome-gradient-accent': 'var(--gold)',
        '--chrome-gradient-card': 'var(--bg-card)', '--chrome-gradient-panel': 'var(--bg-panel)'
      }
    },
    opencode: {
      // De docs/themes/DESIGN-opencode.ai.md: canvas creme, tudo monoespacado,
      // "4px-radius rectangles", "sem sombras, sem gradientes", visual de
      // terminal/manpage com bordas finas (hairline).
      label: '💻 OpenCode',
      vars: {
        '--bg-deep': '#fdfcfc', '--bg-panel': '#f8f7f7', '--bg-card': '#f1eeee',
        '--bg-card-hover': '#e8e4e4', '--border-ink': '#201d1d', '--text-main': '#201d1d',
        '--gold': '#007aff', '--gold-glow': '#4da3ff', '--purple': '#8a5cf6',
        '--terminal-green': '#30d158', '--danger': '#ff3b30', '--muted': '#646262',
        '--font-heading': "'Space Mono', 'Berkeley Mono', monospace",
        '--font-body': "'Space Mono', 'Berkeley Mono', monospace",
        '--font-display': "'Space Mono', 'Berkeley Mono', monospace",
        '--radius-s': '4px', '--radius-m': '4px', '--border-width': '1px',
        '--shadow-chunky': 'none', '--letter-spacing-heading': '0px',
        '--heading-transform': 'none', '--on-accent': '#fdfcfc',
        '--chrome-gradient': 'var(--bg-card)', '--chrome-gradient-accent': 'var(--gold)',
        '--chrome-gradient-card': 'var(--bg-card)', '--chrome-gradient-panel': 'var(--bg-panel)'
      }
    }
  };

  function initTheme() {
    var saved = null;
    try {
      saved = localStorage.getItem('codexMuninTheme');
    } catch (e) {
      saved = null;
    }
    renderThemeList();
    applyTheme(THEMES[saved] ? saved : 'dark');
  }

  function renderThemeList() {
    var select = document.getElementById('themeSelect');
    if (!select) return;
    select.innerHTML = '';
    Object.keys(THEMES).forEach(function (themeId) {
      var opt = document.createElement('option');
      opt.value = themeId;
      opt.textContent = THEMES[themeId].label;
      select.appendChild(opt);
    });
  }

  function toggleTheme() {
    var current = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    applyTheme(current === 'light' ? 'dark' : 'light');
  }

  var DROPDOWN_IDS = ['tagDropdown', 'sortDropdown'];

  function toggleDropdown(dropdownId) {
    var panel = document.getElementById(dropdownId + 'Panel');
    var willOpen = !panel.classList.contains('open');
    DROPDOWN_IDS.forEach(function (id) {
      var p = document.getElementById(id + 'Panel');
      if (p) p.classList.remove('open');
    });
    if (willOpen) {
      panel.classList.add('open');
      if (dropdownId === 'tagDropdown') {
        document.getElementById('tagSearchBox').focus();
      }
    }
  }

  document.addEventListener('click', function (event) {
    DROPDOWN_IDS.forEach(function (id) {
      var dropdown = document.getElementById(id);
      var panel = document.getElementById(id + 'Panel');
      if (dropdown && panel && panel.classList.contains('open') && !dropdown.contains(event.target)) {
        panel.classList.remove('open');
      }
    });
  });

  function applyTheme(themeId) {
    var theme = THEMES[themeId] || THEMES.dark;
    var resolvedId = THEMES[themeId] ? themeId : 'dark';

    document.documentElement.setAttribute('data-theme', resolvedId);
    Object.keys(theme.vars).forEach(function (cssVar) {
      document.documentElement.style.setProperty(cssVar, theme.vars[cssVar]);
    });
    document.dispatchEvent(new CustomEvent('codexThemeChange', { detail: theme.vars }));

    var btn = document.getElementById('themeToggle');
    if (btn) {
      btn.textContent = resolvedId === 'light' ? '☀️ MODO CLARO' : '🌙 MODO ESCURO';
    }
    var select = document.getElementById('themeSelect');
    if (select) select.value = resolvedId;

    try {
      localStorage.setItem('codexMuninTheme', resolvedId);
    } catch (e) {
      /* localStorage indisponivel, ignora persistencia */
    }
  }

  function wireSidebarNav() {
    wireNavGroup('tipoNav', 'tipo', function (value) {
      activeTipo = value;
      applyFilters();
    });
    wireNavGroup('sortNav', 'sort', function (value) {
      activeSort = value;
      applyFilters();
      var sortPanel = document.getElementById('sortDropdownPanel');
      if (sortPanel) sortPanel.classList.remove('open');
    });
  }

  function wireNavGroup(containerId, datasetKey, onSelect) {
    var items = document.querySelectorAll('#' + containerId + ' li');
    items.forEach(function (item) {
      item.onclick = function () {
        items.forEach(function (i) { i.classList.remove('active'); });
        item.classList.add('active');
        onSelect(item.dataset[datasetKey]);
      };
    });
  }

  function onLoadFailure(err) {
    showToast('Falha ao carregar dados: ' + (err && err.message ? err.message : err), 'error');
  }

  function onSkillsLoaded(result) {
    if (!result.success) {
      showToast(friendlyMessage(result), 'error');
      allSkills = [];
    } else {
      allSkills = result.data;
    }
    renderTagPills();
    applyFilters();
  }

  function onCategoriasLoaded(result) {
    var select = document.getElementById('categoryFilter');
    var modalSelect = document.getElementById('skillCategoria');
    if (!result.success) {
      showToast(friendlyMessage(result), 'error');
      return;
    }
    result.data.forEach(function (categoria) {
      var opt1 = document.createElement('option');
      opt1.value = categoria;
      opt1.textContent = categoria;
      select.appendChild(opt1);

      var opt2 = document.createElement('option');
      opt2.value = categoria;
      opt2.textContent = categoria;
      modalSelect.appendChild(opt2);
    });
  }

  function renderTagPills() {
    var container = document.getElementById('tagPills');
    container.innerHTML = '';
    var tagSet = new Set();
    allSkills.forEach(function (skill) {
      (skill.tags || '').split(',').forEach(function (tag) {
        var trimmed = tag.trim();
        if (trimmed) tagSet.add(trimmed);
      });
    });

    var searchBox = document.getElementById('tagSearchBox');
    var tagFilterTerm = searchBox ? searchBox.value.trim().toLowerCase() : '';
    var visibleTags = Array.from(tagSet).sort().filter(function (tag) {
      return !tagFilterTerm || tag.toLowerCase().indexOf(tagFilterTerm) !== -1;
    });

    visibleTags.forEach(function (tag) {
      var pill = document.createElement('span');
      pill.className = 'tag-pill' + (activeTags.has(tag) ? ' active' : '');
      pill.textContent = '#' + tag;
      pill.onclick = function () {
        if (activeTags.has(tag)) {
          activeTags.delete(tag);
        } else {
          activeTags.add(tag);
        }
        renderTagPills();
        applyFilters();
      };
      container.appendChild(pill);
    });
  }

  function applyFilters() {
    var searchTerm = document.getElementById('searchBox').value.toLowerCase();
    var selectedCategory = document.getElementById('categoryFilter').value;

    var filtered = allSkills.filter(function (skill) {
      var haystack = [skill.nome, skill.resumo, skill.autor, skill.tags]
        .join(' ')
        .toLowerCase();
      var matchText = !searchTerm || haystack.indexOf(searchTerm) !== -1;
      var matchCategory = selectedCategory === 'ALL' || skill.categoria_primaria === selectedCategory;
      var matchTipo = activeTipo === 'ALL' || skill.tipo === activeTipo;

      var skillTags = (skill.tags || '').split(',').map(function (t) { return t.trim(); });
      var matchTags = activeTags.size === 0 || Array.from(activeTags).every(function (t) {
        return skillTags.indexOf(t) !== -1;
      });

      return matchText && matchCategory && matchTipo && matchTags;
    });

    var comparator = SORT_COMPARATORS[activeSort] || SORT_COMPARATORS.nome_asc;
    filtered.sort(comparator);

    renderSkillCards(filtered);
  }

  function renderSkillCards(skills) {
    var grid = document.getElementById('skill-grid');
    grid.innerHTML = '';

    if (skills.length === 0) {
      grid.innerHTML = '<div class="empty-state">NENHUMA SKILL ENCONTRADA</div>';
      return;
    }

    skills.forEach(function (skill) {
      grid.appendChild(buildCardElement(skill));
    });
  }

  var CATEGORY_COLORS = {
    'Product & Upstream': 'cat-1',
    'Software Engineering': 'cat-2',
    'Debugging & Troubleshooting': 'cat-3',
    'Quality & Test Automation': 'cat-4',
    'DevOps & Release': 'cat-5',
    'Architecture & Workflows': 'cat-6'
  };

  function buildCardElement(skill) {
    var card = document.createElement('div');
    card.className = 'skill-card';

    var badgeClass = skill.tipo === 'INTERNA' ? 'interna' : 'curadoria';
    var badgeLabel = skill.tipo === 'INTERNA' ? 'INTERNA - ODIN' : 'CURADORIA';
    var categoriaClass = CATEGORY_COLORS[skill.categoria_primaria] || 'cat-default';

    var tagsHtml = (skill.tags || '')
      .split(',')
      .map(function (t) { return t.trim(); })
      .filter(Boolean)
      .map(function (t) { return '<span data-tag="' + escapeHtml(t) + '">#' + escapeHtml(t) + '</span>'; })
      .join('');

    var clones = Number(skill.clones) || 0;
    var healthDot = skill.status_saude === 'VERDE' ? '🟢' :
      skill.status_saude === 'AMARELO' ? '🟡' :
      skill.status_saude === 'VERMELHO' ? '🔴' : '';

    card.innerHTML =
      '<span class="badge ' + badgeClass + '">' + badgeLabel + '</span>' +
      '<h3>' + (healthDot ? healthDot + ' ' : '') + escapeHtml(skill.nome) + '</h3>' +
      '<div class="meta">por ' + escapeHtml(skill.autor) +
      (skill.time_responsavel ? ' · 👥 ' + escapeHtml(skill.time_responsavel) : '') + '</div>' +
      '<span class="categoria-badge ' + categoriaClass + '">' + escapeHtml(skill.categoria_primaria || '') + '</span>' +
      '<div class="resumo">' + escapeHtml(skill.resumo || '') + '</div>' +
      '<div class="tags">' + tagsHtml + '</div>' +
      '<div class="meta clone-count">⬇️ <span data-clone-count>' + clones + '</span> clone(s)/download(s)</div>' +
      '<div class="actions">' +
      '  <a class="pixel-button success" href="' + escapeHtml(skill.zip_url) + '" target="_blank" data-clone="zip">BAIXAR .ZIP</a>' +
      '  <button class="pixel-button secondary" data-clone="bash">GIT BASH</button>' +
      '  <button class="pixel-button secondary" data-clone="powershell">POWERSHELL</button>' +
      '</div>';

    card.querySelectorAll('.tags span[data-tag]').forEach(function (pillEl) {
      pillEl.onclick = function () {
        var tag = pillEl.dataset.tag;
        if (activeTags.has(tag)) {
          activeTags.delete(tag);
        } else {
          activeTags.add(tag);
        }
        renderTagPills();
        applyFilters();
      };
    });

    card.querySelector('[data-clone="zip"]').addEventListener('click', function () {
      trackSkillClone(skill, card);
    });
    card.querySelector('[data-clone="bash"]').onclick = function () {
      copyToClipboard(skill.clone_bash);
      trackSkillClone(skill, card);
    };
    card.querySelector('[data-clone="powershell"]').onclick = function () {
      copyToClipboard(skill.clone_powershell);
      trackSkillClone(skill, card);
    };

    return card;
  }

  function trackSkillClone(skill, card) {
    google.script.run
      .withSuccessHandler(function (result) {
        if (result && result.success) {
          skill.clones = result.data;
          var counter = card.querySelector('[data-clone-count]');
          if (counter) counter.textContent = result.data;
        }
      })
      .withFailureHandler(function () { /* contagem e best-effort, falha silenciosa */ })
      .registerSkillClone(skill.id);
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function copyToClipboard(text) {
    navigator.clipboard.writeText(text).then(function () {
      showToast('Comando copiado!', 'success');
    }, function () {
      showToast('Nao foi possivel copiar.', 'error');
    });
  }

  function showToast(message, type) {
    var toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = 'toast show ' + type;
    setTimeout(function () {
      toast.className = 'toast';
    }, 3000);
  }

  // ---- Modal de cadastro ----

  function openRegisterModal() {
    document.getElementById('registerModal').classList.add('open');
  }

  function closeRegisterModal() {
    document.getElementById('registerModal').classList.remove('open');
    document.getElementById('repoUrlInput').value = '';
    document.getElementById('formFields').style.display = 'none';
    document.getElementById('fetchError').textContent = '';
    document.getElementById('saveError').textContent = '';
    document.getElementById('saveSkillBtn').disabled = true;
    document.querySelectorAll('input[name="tipo"]').forEach(function (radio) {
      radio.checked = false;
    });
    lastFetchedMetadata = null;
  }

  function fetchRepoInfo() {
    var repoUrl = document.getElementById('repoUrlInput').value.trim();
    var errorBox = document.getElementById('fetchError');
    errorBox.textContent = '';

    if (!repoUrl) {
      errorBox.textContent = 'Informe a URL do repositorio.';
      return;
    }

    google.script.run
      .withSuccessHandler(function (result) {
        if (!result.success) {
          errorBox.textContent = friendlyMessage(result);
          document.getElementById('formFields').style.display = 'none';
          document.getElementById('saveSkillBtn').disabled = true;
          return;
        }
        prefillForm(result.data);
      })
      .withFailureHandler(function (err) {
        errorBox.textContent = err && err.message ? err.message : 'Erro ao consultar o GitHub.';
      })
      .previewGithubRepo(repoUrl);
  }

  function prefillForm(metadata) {
    lastFetchedMetadata = metadata;
    document.getElementById('skillNome').value = metadata.name;
    document.getElementById('skillAutor').value = metadata.owner;
    document.getElementById('skillResumo').value = metadata.description;
    document.getElementById('skillTags').value = metadata.topics.join(', ');
    document.getElementById('skillCategoria').value = '';
    document.getElementById('formFields').style.display = 'block';
    document.getElementById('saveSkillBtn').disabled = false;
    updatePreviewBox(metadata);
  }

  function updatePreviewBox(metadata) {
    document.getElementById('previewBox').innerHTML =
      'ZIP: ' + escapeHtml(metadata.zipUrl) +
      '<br>BASH: ' + escapeHtml(metadata.cloneCommands.bash) +
      '<br>POWERSHELL: ' + escapeHtml(metadata.cloneCommands.powershell);
  }

  function saveSkill() {
    var saveError = document.getElementById('saveError');
    saveError.textContent = '';

    if (!lastFetchedMetadata) {
      saveError.textContent = 'Busque as informacoes do repositorio antes de salvar.';
      return;
    }

    var categoria = document.getElementById('skillCategoria').value;
    if (!categoria) {
      saveError.textContent = 'Selecione uma categoria.';
      return;
    }

    var tipoChecked = document.querySelector('input[name="tipo"]:checked');
    if (!tipoChecked) {
      saveError.textContent = 'Selecione o tipo (Interna ou Curadoria).';
      return;
    }

    var payload = {
      repoUrl: document.getElementById('repoUrlInput').value.trim(),
      tipo: tipoChecked.value,
      categoria: categoria,
      tags: document.getElementById('skillTags').value.trim(),
      resumoOverride: document.getElementById('skillResumo').value.trim(),
      nomeOverride: document.getElementById('skillNome').value.trim(),
      timeResponsavel: document.getElementById('skillTimeResponsavel').value.trim()
    };

    document.getElementById('saveSkillBtn').disabled = true;

    google.script.run
      .withSuccessHandler(function (result) {
        document.getElementById('saveSkillBtn').disabled = false;
        if (!result.success) {
          saveError.textContent = friendlyMessage(result);
          return;
        }
        allSkills.push(result.data);
        renderTagPills();
        applyFilters();
        closeRegisterModal();
        showToast('Skill cadastrada com sucesso!', 'success');
      })
      .withFailureHandler(function (err) {
        document.getElementById('saveSkillBtn').disabled = false;
        saveError.textContent = err && err.message ? err.message : 'Erro ao salvar.';
      })
      .registerSkillFromGithub(payload);
  }
</script>

<script>
(function () {
  var canvas = document.getElementById('retroBanner');
  var ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  // O CSS exibe o canvas em 100% da largura da pagina, mas o atributo width
  // do HTML define a resolucao interna de desenho. Sem sincronizar os dois,
  // o navegador estica a imagem (distorcendo os sprites horizontalmente).
  // Ajusta a resolucao interna para bater 1:1 com a largura real exibida.
  function resizeCanvasToDisplaySize_() {
    var displayWidth = canvas.clientWidth;
    if (displayWidth > 0 && canvas.width !== displayWidth) {
      canvas.width = displayWidth;
      ctx.imageSmoothingEnabled = false;
    }
  }
  resizeCanvasToDisplaySize_();
  window.addEventListener('resize', resizeCanvasToDisplaySize_);

  var SPRITE_SIZE = 16;
  var SCALE = 2;

  var PALETTE = {
    '.': 'transparent',
    'K': '#000000',
    'W': '#ffffff',
    'R': '#e52521',
    'B': '#0026ff',
    'G': '#00b140',
    'Y': '#fbd000',
    'S': '#f8b878',
    'D': '#663931',
    'P': '#9b59b6',
    'O': '#ff8c00',
    'C': '#00e5ff',
    'N': '#b0b0b0',
    'F': '#ffae00',
    'E': '#ff69b4'
  };

  // ---- Helpers geometricos: cada personagem e montado com varios
  // fillRect/fillCircle proprios (nao um template compartilhado), para que
  // os detalhes que tornam cada um reconhecivel (bone, bigode, orelhas,
  // casco, crista) fiquem no codigo e nao se percam numa silhueta generica.
  // Homenagens estilizadas, pesquisadas para bater com o design original de
  // cada personagem - nao sao copias pixel-a-pixel dos sprites oficiais.
  function newGrid() {
    var grid = [];
    for (var y = 0; y < SPRITE_SIZE; y++) {
      grid.push(new Array(SPRITE_SIZE).fill('.'));
    }
    return grid;
  }

  function cloneGrid(grid) {
    return grid.map(function (row) { return row.slice(); });
  }

  function fillRect(grid, x0, y0, w, h, color) {
    for (var y = y0; y < y0 + h; y++) {
      for (var x = x0; x < x0 + w; x++) {
        if (grid[y] && x >= 0 && x < SPRITE_SIZE) grid[y][x] = color;
      }
    }
  }

  function fillCircle(grid, cx, cy, r, color) {
    for (var y = 0; y < SPRITE_SIZE; y++) {
      for (var x = 0; x < SPRITE_SIZE; x++) {
        var dx = x - cx + 0.5;
        var dy = y - cy + 0.5;
        if (dx * dx + dy * dy <= r * r) grid[y][x] = color;
      }
    }
  }

  function setPixel(grid, x, y, color) {
    if (grid[y] && x >= 0 && x < SPRITE_SIZE) grid[y][x] = color;
  }

  /**
   * Aplica pernas (linhas 12-15) num torso ja desenhado (linhas 0-11),
   * gerando os 2 frames do ciclo de caminhada (juntas / abertas). A
   * identidade de cada personagem esta toda no torso/cabeca, desenhados a
   * mao por personagem; as pernas sao o unico elemento compartilhado.
   */
  function withWalkCycle(torso, legColor) {
    var frameA = cloneGrid(torso);
    fillRect(frameA, 6, 12, 4, 4, legColor);

    var frameB = cloneGrid(torso);
    fillRect(frameB, 4, 12, 4, 4, legColor);
    fillRect(frameB, 8, 12, 4, 4, legColor);

    return [frameA, frameB];
  }

  function buildMario() {
    var t = newGrid();
    fillRect(t, 5, 0, 6, 2, 'R');             // bone (topo)
    fillRect(t, 4, 2, 8, 2, 'R');             // aba do bone
    fillRect(t, 4, 4, 8, 3, 'S');             // rosto
    setPixel(t, 6, 5, 'K'); setPixel(t, 9, 5, 'K'); // olhos
    fillRect(t, 4, 6, 8, 2, 'D');             // bigode largo
    fillRect(t, 5, 8, 6, 1, 'S');             // queixo
    fillRect(t, 3, 9, 10, 2, 'R');            // camisa vermelha
    fillRect(t, 3, 11, 10, 1, 'B');           // faixa do macacao
    fillRect(t, 5, 11, 2, 1, 'Y');            // botao esquerdo
    fillRect(t, 9, 11, 2, 1, 'Y');            // botao direito
    return withWalkCycle(t, 'B');
  }

  function buildLuigi() {
    var t = newGrid();
    fillRect(t, 5, 0, 6, 3, 'G');             // bone mais alto (Luigi e mais alto que Mario)
    fillRect(t, 4, 3, 8, 2, 'G');
    fillRect(t, 4, 5, 8, 3, 'S');
    setPixel(t, 6, 6, 'K'); setPixel(t, 9, 6, 'K');
    fillRect(t, 4, 7, 8, 2, 'D');
    fillRect(t, 5, 9, 6, 1, 'S');
    fillRect(t, 3, 10, 10, 1, 'G');
    fillRect(t, 3, 11, 10, 1, 'B');
    return withWalkCycle(t, 'B');
  }

  function buildPeach() {
    var t = newGrid();
    setPixel(t, 6, 0, 'N'); setPixel(t, 8, 0, 'N'); setPixel(t, 10, 0, 'N'); // pontas da coroa
    fillRect(t, 5, 1, 7, 2, 'Y');              // cabelo loiro / coroa
    fillRect(t, 4, 3, 8, 3, 'S');               // rosto
    setPixel(t, 6, 4, 'K'); setPixel(t, 9, 4, 'K');
    fillRect(t, 3, 6, 10, 1, 'Y');              // cabelo caindo nos ombros
    fillRect(t, 3, 7, 10, 5, 'E');              // vestido rosa
    fillRect(t, 2, 11, 12, 1, 'E');             // barra do vestido larga
    return withWalkCycle(t, 'E');
  }

  function buildBowser() {
    var t = newGrid();
    setPixel(t, 4, 0, 'W'); setPixel(t, 11, 0, 'W'); // chifres
    fillRect(t, 4, 1, 8, 3, 'O');                // cabeca laranja
    setPixel(t, 6, 2, 'R'); setPixel(t, 9, 2, 'R'); // olhos vermelhos
    fillRect(t, 5, 3, 6, 1, 'W');                 // dentes
    fillRect(t, 3, 4, 10, 2, 'O');                // pescoco/ombros
    fillRect(t, 2, 6, 12, 1, 'G');                // topo do casco
    fillRect(t, 1, 7, 14, 3, 'G');                // casco verde largo
    setPixel(t, 3, 8, 'K'); setPixel(t, 6, 8, 'K'); setPixel(t, 9, 8, 'K'); setPixel(t, 12, 8, 'K'); // pontas do casco
    fillRect(t, 4, 10, 8, 2, 'W');                // barriga branca
    return withWalkCycle(t, 'O');
  }

  function buildYoshi() {
    var t = newGrid();
    fillRect(t, 4, 1, 8, 3, 'G');                // cabeca verde
    setPixel(t, 6, 2, 'W'); setPixel(t, 9, 2, 'W'); // olhos brancos
    fillRect(t, 5, 4, 6, 1, 'O');                 // focinho/boca laranja
    fillRect(t, 3, 5, 10, 2, 'G');                // pescoco
    fillRect(t, 2, 7, 12, 1, 'R');                 // sela vermelha
    fillRect(t, 2, 8, 12, 2, 'G');                 // corpo
    fillRect(t, 4, 10, 8, 2, 'W');                 // barriga branca
    return withWalkCycle(t, 'O');
  }

  function buildLink() {
    var t = newGrid();
    fillRect(t, 6, 0, 4, 1, 'G');                 // ponta do gorro
    fillRect(t, 4, 1, 8, 2, 'G');                 // gorro
    fillRect(t, 4, 3, 8, 3, 'S');                 // rosto
    setPixel(t, 6, 4, 'K'); setPixel(t, 9, 4, 'K');
    fillRect(t, 3, 6, 10, 2, 'G');                 // tunica ombros
    fillRect(t, 3, 8, 10, 3, 'G');                 // tunica
    fillRect(t, 1, 8, 2, 4, 'N');                  // escudo (prata) a esquerda
    setPixel(t, 1, 9, 'B');                        // detalhe azul no escudo
    fillRect(t, 13, 7, 1, 5, 'N');                 // espada a direita
    return withWalkCycle(t, 'D');
  }

  function buildSamus() {
    var t = newGrid();
    fillRect(t, 4, 0, 8, 3, 'O');                  // capacete laranja
    fillRect(t, 4, 2, 8, 1, 'K');                  // viseira
    fillRect(t, 3, 3, 10, 2, 'O');                 // capacete largo
    fillRect(t, 2, 5, 12, 2, 'O');                 // ombreiras largas
    setPixel(t, 3, 5, 'Y'); setPixel(t, 12, 5, 'Y'); // detalhe amarelo nas ombreiras
    fillRect(t, 4, 7, 8, 4, 'O');                   // peitoral/traje
    fillRect(t, 6, 9, 4, 1, 'Y');                   // faixa amarela na cintura
    return withWalkCycle(t, 'O');
  }

  function buildDonkeyKong() {
    var t = newGrid();
    fillRect(t, 4, 0, 8, 3, 'D');                  // cabeca peluda
    fillRect(t, 3, 2, 2, 2, 'D'); fillRect(t, 11, 2, 2, 2, 'D'); // orelhas
    fillRect(t, 5, 3, 6, 2, 'S');                   // rosto
    setPixel(t, 6, 4, 'K'); setPixel(t, 9, 4, 'K');
    fillRect(t, 3, 5, 10, 2, 'D');                  // pescoco/ombros peludos
    fillRect(t, 3, 7, 10, 1, 'R');                  // topo da gravata
    fillRect(t, 5, 8, 2, 1, 'R'); fillRect(t, 9, 8, 2, 1, 'R'); // no da gravata
    fillRect(t, 3, 9, 10, 3, 'D');                  // peito peludo
    return withWalkCycle(t, 'D');
  }

  function buildMegaman() {
    var t = newGrid();
    fillRect(t, 4, 0, 8, 3, 'B');                   // capacete azul
    fillRect(t, 3, 1, 1, 2, 'B'); fillRect(t, 12, 1, 1, 2, 'B'); // "orelhas" do capacete
    fillRect(t, 5, 3, 6, 2, 'W');                    // viseira branca
    setPixel(t, 7, 4, 'R'); setPixel(t, 8, 4, 'R');  // joia vermelha
    fillRect(t, 3, 5, 10, 2, 'B');                   // pescoco/ombros
    fillRect(t, 2, 7, 12, 3, 'B');                   // armadura do peito
    fillRect(t, 5, 8, 6, 1, 'N');                    // detalhe prata no peito
    fillRect(t, 1, 10, 3, 2, 'N');                   // buster (canhao) no braco
    return withWalkCycle(t, 'B');
  }

  function buildSonic() {
    var t = newGrid();
    fillRect(t, 4, 2, 8, 3, 'B');                    // cabeca azul
    fillRect(t, 2, 0, 3, 3, 'B'); fillRect(t, 11, 0, 3, 3, 'B'); // espinhos atras da cabeca
    fillRect(t, 5, 4, 6, 2, 'S');                     // focinho bege
    setPixel(t, 6, 4, 'W'); setPixel(t, 9, 4, 'W');   // olhos
    fillRect(t, 3, 6, 10, 2, 'B');                    // pescoco/ombros
    fillRect(t, 2, 8, 12, 3, 'B');                    // corpo
    fillRect(t, 5, 9, 6, 2, 'S');                     // barriga bege
    return withWalkCycle(t, 'R');
  }

  function buildWario() {
    var t = newGrid();
    fillRect(t, 5, 0, 6, 3, 'Y');                     // bone amarelo
    fillRect(t, 4, 3, 8, 3, 'S');                      // rosto largo
    setPixel(t, 6, 4, 'K'); setPixel(t, 9, 4, 'K');
    fillRect(t, 3, 6, 10, 2, 'D');                     // bigode grande e largo
    setPixel(t, 2, 6, 'D'); setPixel(t, 13, 6, 'D');   // pontas do bigode
    fillRect(t, 5, 8, 6, 1, 'S');
    fillRect(t, 3, 9, 10, 2, 'Y');                      // camisa amarela
    fillRect(t, 3, 11, 10, 1, 'P');                     // macacao roxo
    return withWalkCycle(t, 'P');
  }

  function buildAlexKidd() {
    var t = newGrid();
    fillRect(t, 5, 0, 6, 2, 'D');                       // cabelo castanho
    fillRect(t, 2, 2, 2, 2, 'S'); fillRect(t, 12, 2, 2, 2, 'S'); // orelhas grandes
    fillRect(t, 4, 2, 8, 4, 'S');                        // rosto grande (cabeca grande)
    setPixel(t, 6, 4, 'K'); setPixel(t, 9, 4, 'K');
    fillRect(t, 3, 7, 10, 2, 'R');                       // gi vermelho ombros
    fillRect(t, 3, 9, 10, 1, 'W');                       // faixa branca
    fillRect(t, 3, 10, 10, 2, 'R');                      // gi
    return withWalkCycle(t, 'R');
  }

  function buildKirby() {
    var frameA = newGrid();
    fillCircle(frameA, 8, 8, 6, 'E');
    fillRect(frameA, 2, 11, 3, 2, 'R');
    fillRect(frameA, 11, 11, 3, 2, 'R');
    setPixel(frameA, 5, 7, 'K'); setPixel(frameA, 10, 7, 'K');
    setPixel(frameA, 4, 9, 'R'); setPixel(frameA, 11, 9, 'R');

    var frameB = cloneGrid(frameA);
    fillRect(frameB, 1, 10, 3, 3, 'R');
    fillRect(frameB, 12, 10, 3, 3, 'R');

    return [frameA, frameB];
  }

  function buildSpark() {
    var frameA = newGrid();
    fillCircle(frameA, 8, 9, 6, 'Y');
    fillRect(frameA, 3, 4, 2, 4, 'Y');
    fillRect(frameA, 11, 4, 2, 4, 'Y');
    setPixel(frameA, 3, 3, 'K'); setPixel(frameA, 12, 3, 'K');
    fillRect(frameA, 5, 9, 2, 1, 'R');
    fillRect(frameA, 9, 9, 2, 1, 'R');

    var frameB = cloneGrid(frameA);
    fillRect(frameB, 5, 9, 2, 2, 'R');
    fillRect(frameB, 9, 9, 2, 2, 'R');

    return [frameA, frameB];
  }

  function buildShip(primaryColor) {
    var base = newGrid();
    fillRect(base, 7, 1, 2, 3, primaryColor);
    fillRect(base, 5, 4, 6, 3, primaryColor);
    fillRect(base, 3, 7, 10, 3, primaryColor);
    fillRect(base, 6, 10, 4, 2, 'N');

    var frameA = cloneGrid(base);
    fillRect(frameA, 6, 12, 4, 2, 'F');

    var frameB = cloneGrid(base);
    fillRect(frameB, 7, 12, 2, 3, 'F');

    return [frameA, frameB];
  }

  function buildCar(bodyColor) {
    var base = newGrid();
    fillRect(base, 3, 6, 10, 4, bodyColor);
    fillRect(base, 6, 4, 5, 3, 'C');
    var frameA = cloneGrid(base);
    fillCircle(frameA, 5, 11, 2, 'K');
    fillCircle(frameA, 11, 11, 2, 'K');

    var frameB = cloneGrid(base);
    fillCircle(frameB, 5, 11, 2, 'N');
    fillCircle(frameB, 11, 11, 2, 'N');

    return [frameA, frameB];
  }

  // Homenagens estilizadas, pesquisadas uma a uma para manter as cores e
  // detalhes que tornam cada personagem reconhecivel. Foco em Nintendo
  // (NES/SNES/N64) e Sega Master System, por pedido.
  var SPRITES = {
    mario: { frames: buildMario(), type: 'walk' },              // Super Mario Bros (NES)
    luigi: { frames: buildLuigi(), type: 'walk' },              // Super Mario Bros (NES)
    peach: { frames: buildPeach(), type: 'walk' },              // Super Mario Bros (NES/SNES)
    bowser: { frames: buildBowser(), type: 'walk' },            // Super Mario Bros (NES/SNES)
    yoshi: { frames: buildYoshi(), type: 'walk' },              // Super Mario World (SNES)
    link: { frames: buildLink(), type: 'walk' },                // The Legend of Zelda (NES/SNES)
    samus: { frames: buildSamus(), type: 'walk' },              // Metroid (NES/SNES)
    donkeykong: { frames: buildDonkeyKong(), type: 'walk' },    // Donkey Kong (NES)
    kirby: { frames: buildKirby(), type: 'hop' },               // Kirby (NES/SNES/N64)
    pikachu: { frames: buildSpark(), type: 'walk' },            // Pokemon (Game Boy/N64)
    megaman: { frames: buildMegaman(), type: 'walk' },          // Mega Man (NES)
    sonic: { frames: buildSonic(), type: 'walk' },              // Sonic the Hedgehog (Master System)
    wario: { frames: buildWario(), type: 'walk' },              // Wario Land (Game Boy)
    alexkidd: { frames: buildAlexKidd(), type: 'walk' },        // Alex Kidd in Miracle World (Master System)
    starfox: { frames: buildShip('W'), type: 'fly' },           // Star Fox (SNES)
    fzero: { frames: buildCar('B'), type: 'drive' }             // F-Zero - Blue Falcon (SNES)
  };

  var SPRITE_KEYS = Object.keys(SPRITES);

  function parseFrame(matrix) {
    var imgData = ctx.createImageData(SPRITE_SIZE, SPRITE_SIZE);
    for (var y = 0; y < SPRITE_SIZE; y++) {
      for (var x = 0; x < SPRITE_SIZE; x++) {
        var char = matrix[y][x];
        var hex = PALETTE[char] || 'transparent';
        var i = (y * SPRITE_SIZE + x) * 4;
        if (hex !== 'transparent') {
          imgData.data[i] = parseInt(hex.slice(1, 3), 16);
          imgData.data[i + 1] = parseInt(hex.slice(3, 5), 16);
          imgData.data[i + 2] = parseInt(hex.slice(5, 7), 16);
          imgData.data[i + 3] = 255;
        }
      }
    }
    return imgData;
  }

  var PARSED_SPRITES = {};
  SPRITE_KEYS.forEach(function (key) {
    PARSED_SPRITES[key] = {
      frames: SPRITES[key].frames.map(parseFrame),
      type: SPRITES[key].type
    };
  });

  function randomSpriteKey() {
    return SPRITE_KEYS[Math.floor(Math.random() * SPRITE_KEYS.length)];
  }

  function spawnHero(x) {
    return {
      x: x,
      speed: 0.45 + Math.random() * 0.35,
      key: randomSpriteKey(),
      frameTick: Math.floor(Math.random() * 100),
      bob: Math.random() * Math.PI * 2
    };
  }

  // Densidade proporcional a largura da tela, com limite para nao poluir.
  var HERO_SPACING_PX = 70;
  var numHeroes = Math.min(18, Math.max(8, Math.round(canvas.width / HERO_SPACING_PX)));
  var heroes = [];
  for (var h = 0; h < numHeroes; h++) {
    heroes.push(spawnHero((h / numHeroes) * (canvas.width + 200) - 100));
  }

  var bgOffset = 0;

  function drawFrame(imgData, x, y) {
    for (var sy = 0; sy < SPRITE_SIZE; sy++) {
      for (var sx = 0; sx < SPRITE_SIZE; sx++) {
        var i = (sy * SPRITE_SIZE + sx) * 4;
        var alpha = imgData.data[i + 3];
        if (alpha === 0) continue;
        ctx.fillStyle = 'rgb(' + imgData.data[i] + ',' + imgData.data[i + 1] + ',' + imgData.data[i + 2] + ')';
        ctx.fillRect(x + sx * SCALE, y + sy * SCALE, SCALE, SCALE);
      }
    }
  }

  function render() {
    ctx.fillStyle = '#121826';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#ffffff';
    for (var i = 0; i < 20; i++) {
      var sx = (i * 35 + bgOffset * 0.1) % canvas.width;
      var sy = 5 + (i * 7) % 45;
      ctx.fillRect(sx, sy, 1, 1);
    }

    ctx.fillStyle = '#1e293b';
    for (var m = 0; m < 8; m++) {
      var mx = (m * 90 - bgOffset * 0.2) % (canvas.width + 90) - 45;
      ctx.beginPath();
      ctx.moveTo(mx, 80);
      ctx.lineTo(mx + 45, 36);
      ctx.lineTo(mx + 90, 80);
      ctx.fill();
    }

    ctx.fillStyle = '#334155';
    ctx.fillRect(0, 80, canvas.width, 16);
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 84, canvas.width, 2);

    heroes.forEach(function (h) {
      h.x += h.speed;
      h.frameTick++;

      var sprite = PARSED_SPRITES[h.key];
      var frameIndex = Math.floor(h.frameTick / 10) % sprite.frames.length;
      var y;

      if (sprite.type === 'fly') {
        y = 14;
      } else if (sprite.type === 'drive') {
        y = 48;
      } else if (sprite.type === 'hop') {
        h.bob = (h.bob + 0.07) % (Math.PI * 2);
        y = 48 - Math.abs(Math.sin(h.bob)) * 6;
      } else {
        h.bob = (h.bob + 0.1) % (Math.PI * 2);
        y = 48 + Math.sin(h.bob) * 2;
      }

      drawFrame(sprite.frames[frameIndex], Math.floor(h.x), Math.floor(y));

      if (h.x > canvas.width) {
        h.x = -32;
        h.key = randomSpriteKey();
        h.frameTick = 0;
      }
    });

    bgOffset += 0.5;
    requestAnimationFrame(render);
  }

  render();
})();
</script>

<script>
(function () {
  var canvas = document.getElementById('hiBitBanner');
  var ctx = canvas.getContext('2d');

  // --- 1. Canvas em alta densidade (4K / Retina) -----------------------
  // O HTML define o tamanho em pixels CSS (480x96), mas a resolucao interna
  // de desenho (canvas.width/height) precisa ser multiplicada pelo
  // devicePixelRatio para a tela nao borrar os sprites em monitores de
  // alta densidade. Desenhamos sempre em unidades CSS (via ctx.setTransform)
  // e deixamos o canvas fisico maior por baixo dos panos.
  var cssWidth = 480;
  var cssHeight = 96;

  function fitCanvasToDpr_() {
    var displayWidth = canvas.clientWidth || cssWidth;
    cssWidth = displayWidth;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(cssWidth * dpr);
    canvas.height = Math.round(cssHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;
  }

  fitCanvasToDpr_();
  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fitCanvasToDpr_, 150);
  });

  // --- 2. Assets Hi-Bit via jsDelivr --------------------------------
  // O Google Apps Script (HtmlService) nao serve arquivos estaticos de uma
  // pasta do repositorio em tempo de execucao - so os arquivos .gs/.html
  // enviados via clasp existem no app publicado. Por isso os spritesheets
  // reais (PNG) ficam versionados em assets/sprites/ neste mesmo
  // repositorio GitHub e sao carregados pelo cliente via jsDelivr, que serve
  // o conteudo do GitHub com cabecalhos de CORS corretos para uso em canvas.
  //
  // ASSET_REF e fixado em um SHA de commit (nao em "main") porque o jsDelivr
  // trata URLs com SHA como imutaveis e as mantem em cache para sempre -
  // ou seja, um novo SHA e sempre um cache-miss automatico, sem precisar de
  // purge manual de CDN. Sempre que assets/sprites/ mudar, atualize este
  // valor para o novo SHA do commit correspondente.
  var ASSET_REPO = 'brunotrolo/APP_GAS_Skill_Catalog';
  var ASSET_REF = 'main'; // TODO: trocar para o SHA do commit que adiciona os PNGs reais em assets/sprites/

  function spriteUrl_(relPath) {
    return 'https://cdn.jsdelivr.net/gh/' + ASSET_REPO + '@' + ASSET_REF + '/assets/sprites/' + relPath;
  }

  function loadImageSafe_(src) {
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.__failed = false;
    img.onerror = function () { img.__failed = true; };
    img.src = src;
    return img;
  }

  // --- 3. Catalogo de entidades (spritesheets reais, Hi-Bit) ------------
  // Cada entrada descreve um spritesheet de ciclo de animacao (corrida, voo,
  // etc). "lane: ground" corre sobre a linha de chao do banner; "lane: air"
  // oscila em trajetoria senoidal (amplitude/period) como as naves/avioes.
  // Ate os PNGs reais serem adicionados em assets/sprites/ (ver
  // assets/sprites/LICENSES.md para o passo a passo de sourcing CC0), essas
  // entradas falham silenciosamente ao carregar e o motor usa o tipo de
  // emergencia "fallback" abaixo para o banner nunca ficar vazio.
  var ENTITY_CONFIGS = [
    {
      id: 'platformer_hero_run',
      category: 'PLATFORMER',
      src: spriteUrl_('platformer/hero-run.png'),
      frameWidth: 32, frameHeight: 32, totalFrames: 6, fps: 10,
      scale: 2, lane: 'ground', speed: 42
    },
    {
      id: 'gunner_soldier_run',
      category: 'GUNNER',
      src: spriteUrl_('gunner/soldier-run.png'),
      frameWidth: 32, frameHeight: 32, totalFrames: 8, fps: 12,
      scale: 2, lane: 'ground', speed: 55
    },
    {
      id: 'racer_car_drive',
      category: 'RACER',
      src: spriteUrl_('racer/car-drive.png'),
      frameWidth: 32, frameHeight: 16, totalFrames: 4, fps: 10,
      scale: 2.5, lane: 'ground', speed: 90
    },
    {
      id: 'spaceship_fighter_fly',
      category: 'SPACESHIP',
      src: spriteUrl_('spaceship/fighter-fly.png'),
      frameWidth: 24, frameHeight: 24, totalFrames: 4, fps: 8,
      scale: 2.5, lane: 'air', speed: 70, amplitude: 14, period: 2.5
    },
    // Tipo de emergencia: homenagem original desenhada em blocos de pixel via
    // canvas (nenhum bitmap/sprite de jogo real e copiado), usado enquanto os
    // spritesheets reais acima ainda nao existem ou falham ao carregar.
    {
      id: 'fallback_runner',
      category: 'GUNNER',
      fallback: true,
      frameWidth: 12, frameHeight: 18, totalFrames: 4, fps: 8,
      scale: 3, lane: 'ground', speed: 48
    }
  ];

  var REAL_CONFIGS = ENTITY_CONFIGS.filter(function (c) { return !c.fallback; });
  var FALLBACK_CONFIG = ENTITY_CONFIGS.filter(function (c) { return c.fallback; })[0];

  REAL_CONFIGS.forEach(function (c) { c.image = loadImageSafe_(c.src); });

  // Da um tempo para o load/erro das imagens reais resolver; depois disso,
  // se nenhuma carregou com sucesso, o spawn passa a priorizar o fallback
  // para o banner nunca parecer vazio durante a janela de sourcing dos
  // assets (ver assets/sprites/LICENSES.md).
  var realAssetsReady = false;
  setTimeout(function () {
    realAssetsReady = REAL_CONFIGS.some(function (c) {
      return c.image.complete && c.image.naturalWidth > 0 && !c.image.__failed;
    });
  }, 1500);

  function pickEntityConfig_() {
    var usableReal = REAL_CONFIGS.filter(function (c) {
      return !c.image.__failed && (c.image.complete ? c.image.naturalWidth > 0 : true);
    });
    if (realAssetsReady && usableReal.length > 0) {
      return usableReal[Math.floor(Math.random() * usableReal.length)];
    }
    if (usableReal.length > 0 && Math.random() < 0.5) {
      return usableReal[Math.floor(Math.random() * usableReal.length)];
    }
    return FALLBACK_CONFIG;
  }

  // --- 4. Entidade (instancia em cena) -----------------------------------
  var GROUND_Y = 80; // o banner mantem 96px de altura total

  function Entity(config) {
    this.config = config;
    this.direction = Math.random() < 0.5 ? 1 : -1;
    var dw = config.frameWidth * config.scale;
    this.x = this.direction === 1 ? -dw : cssWidth + dw;
    this.frame = 0;
    this.frameTimer = 0;
    this.airBaseY = 10 + Math.random() * 30;
    this.airPhase = Math.random() * Math.PI * 2;
  }

  Entity.prototype.update = function (dtSec) {
    this.x += this.config.speed * this.direction * dtSec;
    this.frameTimer += dtSec;
    var frameDur = 1 / this.config.fps;
    if (this.frameTimer >= frameDur) {
      this.frameTimer -= frameDur;
      this.frame = (this.frame + 1) % this.config.totalFrames;
    }
  };

  Entity.prototype.isOffscreen = function () {
    var margin = this.config.frameWidth * this.config.scale + 20;
    return this.x < -margin || this.x > cssWidth + margin;
  };

  Entity.prototype.draw = function (ctx) {
    var cfg = this.config;
    var dw = cfg.frameWidth * cfg.scale;
    var dh = cfg.frameHeight * cfg.scale;
    var dy = cfg.lane === 'air'
      ? this.airBaseY + Math.sin((performance.now() / 1000 / cfg.period) * Math.PI * 2 + this.airPhase) * cfg.amplitude
      : GROUND_Y - dh;

    if (cfg.fallback) {
      drawFallbackRunner_(ctx, this.x, dy, dw, dh, this.frame, this.direction);
      return;
    }

    var img = cfg.image;
    if (!img || img.__failed || !img.complete || img.naturalWidth === 0) return;

    var sx = this.frame * cfg.frameWidth;
    ctx.save();
    if (this.direction === -1) {
      ctx.translate(this.x + dw, dy);
      ctx.scale(-1, 1);
      ctx.drawImage(img, sx, 0, cfg.frameWidth, cfg.frameHeight, 0, 0, dw, dh);
    } else {
      ctx.drawImage(img, sx, 0, cfg.frameWidth, cfg.frameHeight, this.x, dy, dw, dh);
    }
    ctx.restore();
  };

  // Figura de emergencia em blocos de pixel (sem bitmap externo), so para
  // garantir que sempre haja algo em cena enquanto os PNGs reais nao estao
  // disponiveis.
  function drawFallbackRunner_(ctx, x, y, dw, dh, frame, direction) {
    var u = dw / 4;
    var legOffset = [0, 1, 0, -1][frame % 4] * u * 0.3;
    ctx.save();
    ctx.translate(x, y);
    if (direction === -1) { ctx.scale(-1, 1); ctx.translate(-dw, 0); }
    ctx.fillStyle = '#55672f';
    ctx.fillRect(u * 0.5, u * 2.2, u * 2, u * 3.2);
    ctx.fillStyle = '#d9a066';
    ctx.fillRect(u * 0.9, u * 1.2, u * 1.2, u * 1.2);
    ctx.fillStyle = '#3a4a2a';
    ctx.fillRect(u * 0.5, u * 0.8, u * 2, u * 1);
    ctx.fillStyle = '#2e3b22';
    ctx.fillRect(u * 0.5, u * 5.2 + legOffset, u * 0.9, u * 1.6);
    ctx.fillRect(u * 1.6 - legOffset, u * 5.2, u * 0.9, u * 1.6);
    ctx.restore();
  }

  // --- 5. Fundo em parallax (procedural, reativo ao tema) ----------------
  // Nao e realista garantir arte de cenario tileavel e verificada como CC0
  // para os 4 generos nesta etapa - por isso o fundo continua procedural,
  // reagindo as variaveis CSS do tema ativo (ver THEME_LIST em
  // ThemeController.html); so os personagens/veiculos/naves acima usam
  // spritesheets reais.
  var bannerColors = { sky: '#0a0b16', stars: '#f3f4fc', mountains: '#262a47', ground: '#181a2c', groundLine: '#000000' };

  function readBannerColors_() {
    var computed = getComputedStyle(document.documentElement);
    function readVar(name, fallback) {
      var value = computed.getPropertyValue(name).trim();
      return value || fallback;
    }
    bannerColors.sky = readVar('--bg-deep', bannerColors.sky);
    bannerColors.stars = readVar('--text-main', bannerColors.stars);
    bannerColors.mountains = readVar('--bg-card-hover', bannerColors.mountains);
    bannerColors.ground = readVar('--bg-panel', bannerColors.ground);
    bannerColors.groundLine = readVar('--border-ink', bannerColors.groundLine);
  }
  readBannerColors_();
  document.addEventListener('codexThemeChange', readBannerColors_);

  var layerOffsets = [0, 0, 0, 0];

  function drawBackground_(dtSec) {
    layerOffsets[0] += 2 * dtSec;
    layerOffsets[1] += 10 * dtSec;
    layerOffsets[2] += 25 * dtSec;
    layerOffsets[3] += 55 * dtSec;

    // Camada 1: ceu / gradiente profundo (quase estatico)
    ctx.fillStyle = bannerColors.sky;
    ctx.fillRect(0, 0, cssWidth, cssHeight);

    // Camada 2: silhuetas distantes (estrelas + montanhas), ~0.2x
    ctx.fillStyle = bannerColors.stars;
    for (var i = 0; i < 20; i++) {
      var sx = (i * 35 + layerOffsets[0]) % cssWidth;
      var sy = 4 + (i * 7) % 45;
      ctx.fillRect(sx, sy, 1, 1);
    }

    ctx.fillStyle = bannerColors.mountains;
    for (var m = 0; m < 8; m++) {
      var mx = (m * 90 - layerOffsets[1]) % (cssWidth + 90) - 45;
      ctx.beginPath();
      ctx.moveTo(mx, GROUND_Y);
      ctx.lineTo(mx + 45, 36);
      ctx.lineTo(mx + 90, GROUND_Y);
      ctx.fill();
    }

    // Camada 3: linha de chao / pista, ~0.5x
    ctx.fillStyle = bannerColors.ground;
    ctx.fillRect(0, GROUND_Y, cssWidth, 16);
    ctx.fillStyle = bannerColors.groundLine;
    ctx.fillRect(0, GROUND_Y + 4, cssWidth, 2);
  }

  function drawForegroundParticles_() {
    // Camada 4: particulas esparsas de primeiro plano (sensacao de velocidade)
    ctx.fillStyle = bannerColors.groundLine;
    for (var p = 0; p < 6; p++) {
      var px = (p * 80 - layerOffsets[3]) % (cssWidth + 80) - 40;
      ctx.fillRect(px, GROUND_Y + 2, 10, 1);
    }
  }

  // --- 6. Loop principal: spawn, update, despawn -------------------------
  var MAX_ENTITIES = 6;
  var entities = [];
  var nextSpawnAt = 0;
  var lastTs = null;

  function maybeSpawn_(nowSec) {
    if (nowSec < nextSpawnAt || entities.length >= MAX_ENTITIES) return;
    entities.push(new Entity(pickEntityConfig_()));
    nextSpawnAt = nowSec + 0.8 + Math.random() * 2.2;
  }

  function tick_(ts) {
    if (lastTs === null) lastTs = ts;
    var dtSec = Math.min((ts - lastTs) / 1000, 0.05);
    lastTs = ts;

    ctx.clearRect(0, 0, cssWidth, cssHeight);
    drawBackground_(dtSec);
    maybeSpawn_(ts / 1000);

    entities = entities.filter(function (e) {
      e.update(dtSec);
      return !e.isOffscreen();
    });
    entities.forEach(function (e) { e.draw(ctx); });

    drawForegroundParticles_();
    requestAnimationFrame(tick_);
  }

  requestAnimationFrame(tick_);
})();
</script>

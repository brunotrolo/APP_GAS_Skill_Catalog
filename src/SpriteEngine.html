<script>
(function () {
  var canvas = document.getElementById('retroBanner');
  var ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  // O CSS exibe o canvas em 100% da largura da pagina, mas o atributo width
  // do HTML define a resolucao interna de desenho. Sem sincronizar os dois,
  // o navegador estica a imagem (distorcendo os sprites horizontalmente).
  // Ajusta a resolucao interna para bater 1:1 com a largura real exibida.
  function resizeCanvasToDisplaySize_() {
    var displayWidth = canvas.clientWidth;
    if (displayWidth > 0 && canvas.width !== displayWidth) {
      canvas.width = displayWidth;
      ctx.imageSmoothingEnabled = false;
    }
  }
  resizeCanvasToDisplaySize_();
  window.addEventListener('resize', resizeCanvasToDisplaySize_);

  var SPRITE_SIZE = 16;
  var SCALE = 2;

  var PALETTE = {
    '.': 'transparent',
    'K': '#000000',
    'W': '#ffffff',
    'R': '#e52521',
    'B': '#0026ff',
    'G': '#00b140',
    'Y': '#fbd000',
    'S': '#f8b878',
    'D': '#663931',
    'P': '#9b59b6',
    'O': '#ff8c00',
    'C': '#00e5ff',
    'N': '#b0b0b0',
    'F': '#ffae00'
  };

  // ---- Helpers geometricos para montar sprites 16x16 por codigo, em vez de
  // matrizes de texto manuais (menos repeticao, zero risco de linha com
  // tamanho errado). Homenagens estilizadas a classicos do 8-bit/16-bit,
  // nao reproducoes dos sprites originais.
  function newGrid() {
    var grid = [];
    for (var y = 0; y < SPRITE_SIZE; y++) {
      grid.push(new Array(SPRITE_SIZE).fill('.'));
    }
    return grid;
  }

  function cloneGrid(grid) {
    return grid.map(function (row) { return row.slice(); });
  }

  function fillRect(grid, x0, y0, w, h, color) {
    for (var y = y0; y < y0 + h; y++) {
      for (var x = x0; x < x0 + w; x++) {
        if (grid[y] && x >= 0 && x < SPRITE_SIZE) grid[y][x] = color;
      }
    }
  }

  function fillCircle(grid, cx, cy, r, color) {
    for (var y = 0; y < SPRITE_SIZE; y++) {
      for (var x = 0; x < SPRITE_SIZE; x++) {
        var dx = x - cx + 0.5;
        var dy = y - cy + 0.5;
        if (dx * dx + dy * dy <= r * r) grid[y][x] = color;
      }
    }
  }

  /**
   * Gera um boneco humanoide generico com 2 frames de caminhada (pernas
   * juntas / pernas abertas). A identidade de cada personagem vem da
   * combinacao de cores, nao da silhueta (mantem o codigo pequeno e sem
   * repeticao para as 11 "classes" humanoides do banner).
   */
  function buildHumanoid(headColor, bodyColor, legColor) {
    var base = newGrid();
    fillRect(base, 6, 1, 4, 4, headColor);
    fillRect(base, 4, 5, 8, 6, bodyColor);
    fillRect(base, 2, 5, 2, 5, bodyColor);
    fillRect(base, 12, 5, 2, 5, bodyColor);

    var frameA = cloneGrid(base);
    fillRect(frameA, 6, 11, 4, 5, legColor);

    var frameB = cloneGrid(base);
    fillRect(frameB, 4, 11, 4, 5, legColor);
    fillRect(frameB, 8, 11, 4, 5, legColor);

    return [frameA, frameB];
  }

  function buildSpark() {
    var frameA = newGrid();
    fillCircle(frameA, 8, 9, 6, 'Y');
    fillRect(frameA, 3, 4, 2, 4, 'Y');
    fillRect(frameA, 11, 4, 2, 4, 'Y');
    fillRect(frameA, 5, 9, 2, 1, 'R');
    fillRect(frameA, 9, 9, 2, 1, 'R');

    var frameB = cloneGrid(frameA);
    fillRect(frameB, 5, 9, 2, 2, 'R');
    fillRect(frameB, 9, 9, 2, 2, 'R');

    return [frameA, frameB];
  }

  function buildPacman() {
    var frameClosed = newGrid();
    fillCircle(frameClosed, 8, 8, 7, 'Y');

    var frameOpen = newGrid();
    for (var y = 0; y < SPRITE_SIZE; y++) {
      for (var x = 0; x < SPRITE_SIZE; x++) {
        var dx = x - 8 + 0.5;
        var dy = y - 8 + 0.5;
        if (dx * dx + dy * dy <= 49 && !(dx > 0 && Math.abs(dy) < dx * 0.8)) {
          frameOpen[y][x] = 'Y';
        }
      }
    }

    return [frameOpen, frameClosed];
  }

  function buildInvader() {
    var rows = [
      "..K..........K.",
      "...K........K..",
      "..KKKKKKKKKKK..",
      ".KK.KK.KK.KK.K.",
      "KKKKKKKKKKKKKKK",
      "KK.KKKKKKKKK.KK",
      "KK.K.......K.KK",
      "...KK.....KK..."
    ];
    var frameA = newGrid();
    for (var y = 0; y < rows.length; y++) {
      for (var x = 0; x < rows[y].length; x++) {
        if (rows[y][x] === 'K') frameA[y + 3][x] = 'G';
      }
    }
    var frameB = cloneGrid(frameA);
    fillRect(frameB, 1, 11, 2, 2, 'G');
    fillRect(frameB, 13, 11, 2, 2, 'G');
    return [frameA, frameB];
  }

  function buildTetrisBlock() {
    var frameA = newGrid();
    fillRect(frameA, 4, 4, 4, 4, 'C');
    fillRect(frameA, 8, 4, 4, 4, 'C');
    fillRect(frameA, 4, 8, 4, 4, 'C');
    fillRect(frameA, 8, 8, 4, 4, 'C');

    var frameB = newGrid();
    fillRect(frameB, 4, 4, 4, 4, 'B');
    fillRect(frameB, 8, 4, 4, 4, 'B');
    fillRect(frameB, 4, 8, 4, 4, 'B');
    fillRect(frameB, 8, 8, 4, 4, 'B');

    return [frameA, frameB];
  }

  function buildFrog() {
    var frameTucked = newGrid();
    fillCircle(frameTucked, 8, 9, 5, 'G');
    fillRect(frameTucked, 5, 5, 2, 2, 'G');
    fillRect(frameTucked, 9, 5, 2, 2, 'G');

    var frameExtended = newGrid();
    fillCircle(frameExtended, 8, 8, 5, 'G');
    fillRect(frameExtended, 5, 5, 2, 2, 'G');
    fillRect(frameExtended, 9, 5, 2, 2, 'G');
    fillRect(frameExtended, 1, 11, 3, 2, 'G');
    fillRect(frameExtended, 12, 11, 3, 2, 'G');

    return [frameTucked, frameExtended];
  }

  function buildShip(primaryColor) {
    var base = newGrid();
    fillRect(base, 7, 1, 2, 3, primaryColor);
    fillRect(base, 5, 4, 6, 3, primaryColor);
    fillRect(base, 3, 7, 10, 3, primaryColor);
    fillRect(base, 6, 10, 4, 2, 'N');

    var frameA = cloneGrid(base);
    fillRect(frameA, 6, 12, 4, 2, 'F');

    var frameB = cloneGrid(base);
    fillRect(frameB, 7, 12, 2, 3, 'F');

    return [frameA, frameB];
  }

  function buildCar() {
    var base = newGrid();
    fillRect(base, 3, 6, 10, 4, 'R');
    fillRect(base, 6, 4, 5, 3, 'C');
    var frameA = cloneGrid(base);
    fillCircle(frameA, 5, 11, 2, 'K');
    fillCircle(frameA, 11, 11, 2, 'K');

    var frameB = cloneGrid(base);
    fillCircle(frameB, 5, 11, 2, 'N');
    fillCircle(frameB, 11, 11, 2, 'N');

    return [frameA, frameB];
  }

  function buildBike() {
    var base = newGrid();
    fillRect(base, 6, 3, 4, 5, 'S');
    fillRect(base, 5, 8, 6, 3, 'D');
    var frameA = cloneGrid(base);
    fillCircle(frameA, 4, 12, 2, 'K');
    fillCircle(frameA, 12, 12, 2, 'K');

    var frameB = cloneGrid(base);
    fillCircle(frameB, 4, 12, 2, 'N');
    fillCircle(frameB, 12, 12, 2, 'N');

    return [frameA, frameB];
  }

  // Homenagens estilizadas a 20 classicos do 8/16-bit (personagem/veiculo
  // principal + animacao caracteristica de cada um) - nao sao copias dos
  // assets originais. type define o comportamento de movimento no banner:
  // 'walk'/'hop' andam no chao com balanco vertical, 'drive' roda no chao
  // sem balanco (rodas giram), 'fly' sobrevoa a parte alta do cenario.
  var SPRITES = {
    plumber:   { frames: buildHumanoid('S', 'R', 'B'), type: 'walk' },   // Super Mario Bros
    elf:       { frames: buildHumanoid('S', 'G', 'D'), type: 'walk' },   // The Legend of Zelda
    spark:     { frames: buildSpark(),                 type: 'walk' },  // Pokemon
    valkyrie:  { frames: buildHumanoid('S', 'P', 'D'), type: 'walk' },   // D&D / Odin (Norse RPG)
    pacman:    { frames: buildPacman(),                type: 'walk' },  // Pac-Man
    invader:   { frames: buildInvader(),               type: 'walk' },  // Space Invaders
    galaga:    { frames: buildShip('R'),               type: 'fly' },   // Galaga
    kong:      { frames: buildHumanoid('D', 'D', 'K'), type: 'walk' },  // Donkey Kong
    sonic:     { frames: buildHumanoid('B', 'B', 'R'), type: 'walk' },  // Sonic the Hedgehog
    megaman:   { frames: buildHumanoid('B', 'B', 'W'), type: 'walk' },  // Mega Man
    fighter:   { frames: buildHumanoid('S', 'W', 'K'), type: 'walk' },  // Street Fighter
    tetris:    { frames: buildTetrisBlock(),           type: 'fly' },   // Tetris (cai do alto)
    commando:  { frames: buildHumanoid('S', 'G', 'G'), type: 'walk' },  // Contra
    hunter:    { frames: buildHumanoid('O', 'O', 'K'), type: 'walk' },  // Metroid
    vhunter:   { frames: buildHumanoid('S', 'D', 'W'), type: 'walk' },  // Castlevania
    knight:    { frames: buildHumanoid('S', 'B', 'C'), type: 'walk' },  // Final Fantasy
    outrun:    { frames: buildCar(),                   type: 'drive' },// Out Run
    asteroids: { frames: buildShip('W'),                type: 'fly' },  // Asteroids
    frogger:   { frames: buildFrog(),                  type: 'hop' },  // Frogger
    excitebike:{ frames: buildBike(),                  type: 'drive' } // Excitebike
  };

  var SPRITE_KEYS = Object.keys(SPRITES);

  function parseFrame(matrix) {
    var imgData = ctx.createImageData(SPRITE_SIZE, SPRITE_SIZE);
    for (var y = 0; y < SPRITE_SIZE; y++) {
      for (var x = 0; x < SPRITE_SIZE; x++) {
        var char = matrix[y][x];
        var hex = PALETTE[char] || 'transparent';
        var i = (y * SPRITE_SIZE + x) * 4;
        if (hex !== 'transparent') {
          imgData.data[i] = parseInt(hex.slice(1, 3), 16);
          imgData.data[i + 1] = parseInt(hex.slice(3, 5), 16);
          imgData.data[i + 2] = parseInt(hex.slice(5, 7), 16);
          imgData.data[i + 3] = 255;
        }
      }
    }
    return imgData;
  }

  var PARSED_SPRITES = {};
  SPRITE_KEYS.forEach(function (key) {
    PARSED_SPRITES[key] = {
      frames: SPRITES[key].frames.map(parseFrame),
      type: SPRITES[key].type
    };
  });

  function randomSpriteKey() {
    return SPRITE_KEYS[Math.floor(Math.random() * SPRITE_KEYS.length)];
  }

  function spawnHero(x) {
    return {
      x: x,
      speed: 0.45 + Math.random() * 0.35,
      key: randomSpriteKey(),
      frameTick: Math.floor(Math.random() * 100),
      bob: Math.random() * Math.PI * 2
    };
  }

  var heroes = [
    spawnHero(30), spawnHero(160), spawnHero(300), spawnHero(440), spawnHero(560)
  ];

  var bgOffset = 0;

  function drawFrame(imgData, x, y) {
    for (var sy = 0; sy < SPRITE_SIZE; sy++) {
      for (var sx = 0; sx < SPRITE_SIZE; sx++) {
        var i = (sy * SPRITE_SIZE + sx) * 4;
        var alpha = imgData.data[i + 3];
        if (alpha === 0) continue;
        ctx.fillStyle = 'rgb(' + imgData.data[i] + ',' + imgData.data[i + 1] + ',' + imgData.data[i + 2] + ')';
        ctx.fillRect(x + sx * SCALE, y + sy * SCALE, SCALE, SCALE);
      }
    }
  }

  function render() {
    ctx.fillStyle = '#121826';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#ffffff';
    for (var i = 0; i < 20; i++) {
      var sx = (i * 35 + bgOffset * 0.1) % canvas.width;
      var sy = 5 + (i * 7) % 45;
      ctx.fillRect(sx, sy, 1, 1);
    }

    ctx.fillStyle = '#1e293b';
    for (var m = 0; m < 8; m++) {
      var mx = (m * 90 - bgOffset * 0.2) % (canvas.width + 90) - 45;
      ctx.beginPath();
      ctx.moveTo(mx, 80);
      ctx.lineTo(mx + 45, 36);
      ctx.lineTo(mx + 90, 80);
      ctx.fill();
    }

    ctx.fillStyle = '#334155';
    ctx.fillRect(0, 80, canvas.width, 16);
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 84, canvas.width, 2);

    heroes.forEach(function (h) {
      h.x += h.speed;
      h.frameTick++;

      var sprite = PARSED_SPRITES[h.key];
      var frameIndex = Math.floor(h.frameTick / 10) % sprite.frames.length;
      var y;

      if (sprite.type === 'fly') {
        y = 14;
      } else if (sprite.type === 'drive') {
        y = 48;
      } else if (sprite.type === 'hop') {
        h.bob = (h.bob + 0.07) % (Math.PI * 2);
        y = 48 - Math.abs(Math.sin(h.bob)) * 6;
      } else {
        h.bob = (h.bob + 0.1) % (Math.PI * 2);
        y = 48 + Math.sin(h.bob) * 2;
      }

      drawFrame(sprite.frames[frameIndex], Math.floor(h.x), Math.floor(y));

      if (h.x > canvas.width) {
        h.x = -32;
        h.key = randomSpriteKey();
        h.frameTick = 0;
      }
    });

    bgOffset += 0.5;
    requestAnimationFrame(render);
  }

  render();
})();
</script>

  // do HTML define a resolucao interna de desenho. Sem sincronizar os dois,
  // o navegador estica a imagem (distorcendo os sprites horizontalmente).
  // Ajusta a resolucao interna para bater 1:1 com a largura real exibida.
  function resizeCanvasToDisplaySize_() {
    var displayWidth = canvas.clientWidth;
    if (displayWidth > 0 && canvas.width !== displayWidth) {

      ctx.imageSmoothingEnabled = false;

  // Soldados estilo "run and gun" (homenagem original, desenhada em blocos de
  // pixel via canvas - nenhum sprite/bitmap de jogo real e copiado) com
  // sequencias de acao de verdade: correr, parar e atirar, agachar e atirar,
  // pular e arremessar granada, escolhidas aleatoriamente por soldado.
  var SOLDIER_UNIT = 3; // tamanho de cada "pixel grosso" do soldado, em px

  var SOLDIER_PALETTES = [
    { helmet: '#3a4a2a', vest: '#55672f', pants: '#2e3b22', skin: '#d9a066', boot: '#1b1b1b', gun: '#4a4a4a', pack: '#44532a' },
    { helmet: '#4a3a2a', vest: '#8a6a3a', pants: '#5a4530', skin: '#d9a066', boot: '#1b1b1b', gun: '#4a4a4a', pack: '#6b5230' },
    { helmet: '#2a2a2e', vest: '#3a3a40', pants: '#1f1f24', skin: '#c98a60', boot: '#000000', gun: '#5a5a5a', pack: '#2e2e34' }
  ];

  var SOLDIER_ACTIONS = ['run', 'run', 'run', 'shoot', 'crouch_shoot', 'jump', 'grenade'];

  function pickSoldierAction() {
    var action = SOLDIER_ACTIONS[Math.floor(Math.random() * SOLDIER_ACTIONS.length)];
    var duration = action === 'run' ? 70 + Math.random() * 90 :
      action === 'jump' ? 18 + Math.random() * 10 :
      40 + Math.random() * 40;
    return { action: action, ticksLeft: Math.round(duration), totalTicks: Math.round(duration), tick: 0 };
  }

  /**
   * Desenha um soldado em blocos de pixel (x,y = pes no chao). Pose/frame
   * variam conforme a acao atual, dando movimento real de pernas/braco/arma
   * em vez de so um balanco vertical.
   */
  function drawSoldier(ctx, x, y, palette, action, frame) {
    var u = SOLDIER_UNIT;
    function block(gx, gy, gw, gh, color) {
      ctx.fillStyle = color;
      ctx.fillRect(Math.round(x + gx * u), Math.round(y + gy * u), Math.ceil(gw * u), Math.ceil(gh * u));
    }

    var legOffset = 0, armForward = 0, crouch = 0, muzzle = false;

    if (action === 'run') {
      legOffset = [0, 1.5, 0, -1.5][frame % 4];
    } else if (action === 'shoot') {
      muzzle = frame === 1;
    } else if (action === 'crouch_shoot') {
      crouch = 2;
      muzzle = frame === 1;
    } else if (action === 'jump') {
      crouch = -1.5;
      legOffset = 1;
    } else if (action === 'grenade') {
      armForward = [-1, 0, 2][frame] || 0;
    }

    var headY = -14 + crouch;
    var torsoY = -11 + crouch;
    var legY = -5 + crouch;

    block(-1, torsoY + 1, 2, 4, palette.pack);
    block(0, legY, 2, 5, palette.pants);
    block(2 + legOffset, legY, 2, 5, palette.pants);
    block(0, legY + 4, 2, 1, palette.boot);
    block(2 + legOffset, legY + 4, 2, 1, palette.boot);
    block(0, torsoY, 4, 6, palette.vest);
    block(1, headY, 2, 2, palette.skin);
    block(0, headY - 1, 4, 2, palette.helmet);

    var gunLen = action === 'crouch_shoot' ? 5 : 6;
    var gunY = torsoY + 2;
    var gunX = 4 + armForward;
    block(gunX, gunY, gunLen, 1, palette.gun);

    if (action === 'grenade' && frame === 2) {
      ctx.fillStyle = '#6b7a3a';
      ctx.beginPath();
      ctx.arc(Math.round(x + (gunX + gunLen + 3) * u), Math.round(y + (gunY - 1) * u), u * 0.8, 0, Math.PI * 2);
      ctx.fill();
    }

    if (muzzle) {
      ctx.fillStyle = '#ffe98a';
      ctx.beginPath();
      ctx.arc(Math.round(x + (gunX + gunLen) * u), Math.round(y + (gunY + 0.5) * u), u * 1.3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Personagens derivados dos 27 tiles Kenney (ceu: foguete/UFO/nave/alien
  // sobrevoando ao fundo) + soldados procedurais (chao, protagonistas do banner).
  var CHARACTERS = [
    { key: 'rocket', frames: [15, 16, 17], type: 'fly' },
    { key: 'ufo', frames: [18, 19, 20], type: 'fly' },
    { key: 'bigship', frames: [21, 22, 23], type: 'fly' },
    { key: 'alienIcon', frames: [24, 25, 26], type: 'fly' },
    { key: 'soldierGreen', type: 'soldier', palette: SOLDIER_PALETTES[0] },
    { key: 'soldierGreen2', type: 'soldier', palette: SOLDIER_PALETTES[0] },
    { key: 'soldierTan', type: 'soldier', palette: SOLDIER_PALETTES[1] },
    { key: 'soldierTan2', type: 'soldier', palette: SOLDIER_PALETTES[1] },
    { key: 'soldierBlack', type: 'soldier', palette: SOLDIER_PALETTES[2] },
    { key: 'soldierBlack2', type: 'soldier', palette: SOLDIER_PALETTES[2] }
  ];

  function randomCharacter() {
    return CHARACTERS[Math.floor(Math.random() * CHARACTERS.length)];
  }

  function spawnHero(x) {
    var character = randomCharacter();
    return {
      x: x,
      speed: 0.45 + Math.random() * 0.35,
      character: character,
      tick: Math.floor(Math.random() * 60),
      bob: Math.random() * Math.PI * 2,
      soldierState: character.type === 'soldier' ? pickSoldierAction() : null
    };
  }

  var DISPLAY_SIZE = TILE_SRC_SIZE * SCALE;
  var HERO_SPACING_PX = 100;
  var numHeroes = Math.min(14, Math.max(7, Math.round(canvas.width / HERO_SPACING_PX)));
  var heroes = [];
  for (var h = 0; h < numHeroes; h++) {
    heroes.push(spawnHero((h / numHeroes) * (canvas.width + 200) - 100));
  }

  var bgOffset = 0;
  var GROUND_Y = 80; // banner mantem 96px de altura total

  // O cenario do banner acompanha o tema selecionado (ver THEMES em
  // Script.html): le as CSS custom properties atuais em vez de cores fixas,
  // e re-le quando 'codexThemeChange' dispara (troca de tema em tempo real).
  var bannerColors = { sky: '#0a0b16', stars: '#f3f4fc', mountains: '#262a47', ground: '#181a2c', groundLine: '#000000' };

  function readBannerColors_() {
    var computed = getComputedStyle(document.documentElement);
    function readVar(name, fallback) {
      var value = computed.getPropertyValue(name).trim();
      return value || fallback;
    }
    bannerColors.sky = readVar('--bg-deep', bannerColors.sky);
    bannerColors.stars = readVar('--text-main', bannerColors.stars);
    bannerColors.mountains = readVar('--bg-card-hover', bannerColors.mountains);
    bannerColors.ground = readVar('--bg-panel', bannerColors.ground);
    bannerColors.groundLine = readVar('--border-ink', bannerColors.groundLine);
  }
  readBannerColors_();
  document.addEventListener('codexThemeChange', readBannerColors_);

  function render() {
    ctx.fillStyle = bannerColors.sky;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = bannerColors.stars;
    for (var i = 0; i < 20; i++) {
      var sx = (i * 35 + bgOffset * 0.1) % canvas.width;
      var sy = 4 + (i * 7) % 45;
      ctx.fillRect(sx, sy, 1, 1);
    }

    ctx.fillStyle = bannerColors.mountains;
    for (var m = 0; m < 8; m++) {
      var mx = (m * 90 - bgOffset * 0.2) % (canvas.width + 90) - 45;
      ctx.beginPath();
      ctx.moveTo(mx, GROUND_Y);
      ctx.lineTo(mx + 45, 36);
      ctx.lineTo(mx + 90, GROUND_Y);
      ctx.fill();
    }

    ctx.fillStyle = bannerColors.ground;
    ctx.fillRect(0, GROUND_Y, canvas.width, 16);
    ctx.fillStyle = bannerColors.groundLine;
    ctx.fillRect(0, GROUND_Y + 4, canvas.width, 2);

    heroes.forEach(function (h) {
      h.tick++;

      if (h.character.type === 'soldier') {
        var st = h.soldierState;
        st.tick++;
        st.ticksLeft--;
        if (st.ticksLeft <= 0) {
          h.soldierState = st = pickSoldierAction();
        }

        var frame;
        if (st.action === 'run') {
          frame = Math.floor(st.tick / 6) % 4;
          h.x += h.speed * 1.4;
        } else if (st.action === 'jump') {
          frame = 0;
          h.x += h.speed * 0.6;
        } else if (st.action === 'grenade') {
          frame = Math.min(2, Math.floor(st.tick / 15));
        } else {
          frame = Math.floor(st.tick / 10) % 2;
        }

        var jumpArc = st.action === 'jump' ? -Math.sin((1 - st.ticksLeft / st.totalTicks) * Math.PI) * 14 : 0;
        drawSoldier(ctx, h.x, GROUND_Y + jumpArc, h.character.palette, st.action, frame);

        if (h.x > canvas.width) {
          h.x = -30;
          h.character = randomCharacter();
          h.soldierState = h.character.type === 'soldier' ? pickSoldierAction() : null;
          h.tick = 0;
        }
        return;
      }

      h.x += h.speed;
      var frames = h.character.frames;
      var frameIndex = Math.floor(h.tick / 14) % frames.length;
      var img = tileImages[frames[frameIndex]];
      var y;

      if (h.character.type === 'fly') {
        y = 10;
      } else {
        h.bob = (h.bob + 0.08) % (Math.PI * 2);
        y = GROUND_Y - DISPLAY_SIZE + 6 + Math.sin(h.bob) * 3;
      }

      if (img.complete && img.naturalWidth > 0) {
        ctx.drawImage(img, Math.floor(h.x), Math.floor(y), DISPLAY_SIZE, DISPLAY_SIZE);
      }

      if (h.x > canvas.width) {
        h.x = -DISPLAY_SIZE;
        h.character = randomCharacter();
        h.soldierState = h.character.type === 'soldier' ? pickSoldierAction() : null;
        h.tick = 0;
      }
    });

    bgOffset += 0.5;
    requestAnimationFrame(render);
  }

  render();
})();
</script>

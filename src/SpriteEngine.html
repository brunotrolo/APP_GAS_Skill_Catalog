<script>
(function () {
  var canvas = document.getElementById('hiBitBanner');
  var ctx = canvas.getContext('2d');

  // --- 1. Canvas em alta densidade (4K / Retina) -----------------------
  var cssWidth = 480;
  var cssHeight = 96;

  function fitCanvasToDpr_() {
    var displayWidth = canvas.clientWidth || cssWidth;
    cssWidth = displayWidth;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(cssWidth * dpr);
    canvas.height = Math.round(cssHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = false;
  }

  fitCanvasToDpr_();
  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fitCanvasToDpr_, 150);
  });

  // --- 2. Cores reativas ao tema ativo -----------------------------------
  // A cena e desenhada em canvas puro (vetores/formas), entao ela recolore
  // junto com qualquer um dos temas do app (ver THEME_LIST em
  // ThemeController.html), lendo as mesmas CSS custom properties que o
  // resto da UI usa.
  var colors = {
    skyTop: '#1b1033', skyBottom: '#0a0b16', aurora: '#2e8f7a',
    stars: '#f3f4fc', moon: '#eef0fb', mountains: '#262a47',
    mountainsFar: '#181a2c', ground: '#181a2c', groundLine: '#000000',
    silhouette: '#05050a', gold: '#ffd84a'
  };

  function readColors_() {
    var computed = getComputedStyle(document.documentElement);
    function readVar(name, fallback) {
      var value = computed.getPropertyValue(name).trim();
      return value || fallback;
    }
    colors.skyBottom = readVar('--bg-deep', colors.skyBottom);
    colors.aurora = readVar('--terminal-green', colors.aurora);
    colors.stars = readVar('--text-main', colors.stars);
    colors.moon = readVar('--text-main', colors.moon);
    colors.mountains = readVar('--bg-card-hover', colors.mountains);
    colors.mountainsFar = readVar('--bg-panel', colors.mountainsFar);
    colors.ground = readVar('--bg-panel', colors.ground);
    colors.groundLine = readVar('--border-ink', colors.groundLine);
    colors.gold = readVar('--gold', colors.gold);
  }
  readColors_();
  document.addEventListener('codexThemeChange', readColors_);

  // --- 3. Corvos de Odin (Huginn e Muninn) --------------------------------
  // Unicos bitmaps da cena - o resto e desenhado em canvas puro. Pack CC0
  // "Pixel Raven" por Commander (OpenGameArt.org) - ver
  // assets/sprites/LICENSES.md. Hospedados via jsDelivr apontando para este
  // repositorio (o GAS HtmlService nao serve arquivos estaticos de pasta).
  var ASSET_REPO = 'brunotrolo/APP_GAS_Skill_Catalog';
  var ASSET_REF = 'a41e6d8d5f95c8d49d3caec106f9f9659f8bacc7'; // commit que adiciona os corvos e o heroi (assets/sprites/)

  function spriteUrl_(relPath) {
    return 'https://cdn.jsdelivr.net/gh/' + ASSET_REPO + '@' + ASSET_REF + '/assets/sprites/' + relPath;
  }

  function loadImageSafe_(src) {
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.__failed = false;
    img.onerror = function () { img.__failed = true; };
    img.src = src;
    return img;
  }

  var huginn = loadImageSafe_(spriteUrl_('raven/huginn.png'));
  var muninn = loadImageSafe_(spriteUrl_('raven/muninn.png'));

  function drawRaven_(img, x, y, h) {
    if (img.__failed || !img.complete || img.naturalWidth === 0) return;
    var w = h * (img.naturalWidth / img.naturalHeight);
    ctx.drawImage(img, Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  }

  // --- 3b. Heroi animado (guerreiro viking) -------------------------------
  // Unico personagem em cena, com ciclos de animacao reais (correr, parado
  // respirando, golpe de machado) - sem motor de spawn/multiplas entidades,
  // entao nao ha risco de sobreposicao. Pack "Viking - 2D Pixel Art
  // Character Pack" (ByteBox, itch.io) - uso livre em projetos pessoais e
  // comerciais, sem revenda/redistribuicao do asset em si (ver
  // assets/sprites/LICENSES.md). Frames 48x48, viradas para a direita.
  var HERO_FRAME = 48;
  var HERO_ANIMS = {
    run: { img: loadImageSafe_(spriteUrl_('hero/run.png')), frames: 8, fps: 10 },
    idle: { img: loadImageSafe_(spriteUrl_('hero/idle.png')), frames: 11, fps: 8 },
    attack: { img: loadImageSafe_(spriteUrl_('hero/attack.png')), frames: 8, fps: 14 }
  };
  var HERO_SCALE = 2.3;
  var HERO_RUN_SPEED = 46; // px/s
  var HERO_STOP_X = 190; // onde o heroi para para o golpe, antes da arvore
  var HERO_IDLE_SECONDS = 1.1;

  var hero = {
    x: -HERO_FRAME * HERO_SCALE,
    state: 'run',
    frame: 0,
    frameTimer: 0,
    idleTimer: 0,
    hasPerformed: false // evita repetir o golpe em loop enquanto atravessa o ponto de parada
  };

  function updateHero_(dt) {
    var anim = HERO_ANIMS[hero.state];
    hero.frameTimer += dt;
    var frameDur = 1 / anim.fps;
    if (hero.frameTimer >= frameDur) {
      hero.frameTimer -= frameDur;
      hero.frame++;
      if (hero.frame >= anim.frames) {
        hero.frame = 0;
        if (hero.state === 'attack') hero.state = 'run';
      }
    }

    if (hero.state === 'run') {
      hero.x += HERO_RUN_SPEED * dt;
      if (!hero.hasPerformed && hero.x >= HERO_STOP_X) {
        hero.hasPerformed = true;
        hero.state = 'idle';
        hero.frame = 0;
        hero.frameTimer = 0;
        hero.idleTimer = 0;
      }
      if (hero.x > cssWidth + HERO_FRAME * HERO_SCALE) {
        hero.x = -HERO_FRAME * HERO_SCALE;
        hero.hasPerformed = false;
      }
    } else if (hero.state === 'idle') {
      hero.idleTimer += dt;
      if (hero.idleTimer >= HERO_IDLE_SECONDS) {
        hero.state = 'attack';
        hero.frame = 0;
        hero.frameTimer = 0;
      }
    }
    // 'attack' avanca sozinho via contagem de frames acima.
  }

  // O sprite de 48x48 tem uma margem vazia (transparente) no topo do frame -
  // o personagem ocupa so a faixa inferior (~y9-48 cobre corre/parado/golpe,
  // incluindo o machado erguido no golpe). Recortar essa margem antes de
  // escalar permite um personagem maior sem estourar a altura fixa do
  // banner nem cortar a cabeca/pes.
  var HERO_CROP_TOP = 9;
  var HERO_CROP_H = HERO_FRAME - HERO_CROP_TOP;

  function drawHero_() {
    var anim = HERO_ANIMS[hero.state];
    var img = anim.img;
    if (img.__failed || !img.complete || img.naturalWidth === 0) return;
    var dw = HERO_FRAME * HERO_SCALE;
    var dh = HERO_CROP_H * HERO_SCALE;
    var sx = hero.frame * HERO_FRAME;
    var feetY = GROUND_Y + 6; // pes afundam de leve na faixa de chao (fundo solido, imperceptivel)
    var dy = Math.max(2, feetY - dh);
    ctx.drawImage(img, sx, HERO_CROP_TOP, HERO_FRAME, HERO_CROP_H, Math.round(hero.x), Math.round(dy), dw, dh);
  }

  // --- 4. Elementos proceduais da cena (vetores puros, sem assets) --------
  var GROUND_Y = 80;

  // Estrelas fixas (posicao estavel entre frames, so a opacidade pisca)
  var STAR_COUNT = 28;
  var stars = [];
  for (var s = 0; s < STAR_COUNT; s++) {
    stars.push({
      x: (s * 53 + 17) % 480,
      y: 4 + (s * 11) % 46,
      phase: Math.random() * Math.PI * 2,
      speed: 0.6 + Math.random() * 0.8
    });
  }

  function drawSky_() {
    var grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    grad.addColorStop(0, colors.skyTop);
    grad.addColorStop(1, colors.skyBottom);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, cssWidth, cssHeight);
  }

  function drawAurora_(t) {
    // Faixas suaves de "aurora" ondulando bem devagar - unico movimento
    // continuo da cena, alem do piscar das estrelas.
    ctx.save();
    ctx.globalAlpha = 0.16;
    ctx.strokeStyle = colors.aurora;
    ctx.lineWidth = 3;
    for (var band = 0; band < 2; band++) {
      ctx.beginPath();
      for (var x = 0; x <= cssWidth; x += 8) {
        var y = 16 + band * 10 + Math.sin(x * 0.02 + t * 0.3 + band * 2) * 6;
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawStars_(t) {
    stars.forEach(function (star) {
      var twinkle = 0.4 + 0.6 * Math.abs(Math.sin(t * star.speed + star.phase));
      ctx.globalAlpha = twinkle;
      ctx.fillStyle = colors.stars;
      ctx.fillRect(star.x, star.y, 1, 1);
    });
    ctx.globalAlpha = 1;
  }

  function drawMoon_(t) {
    var mx = 404, my = 22, r = 13;
    var pulse = 0.85 + 0.15 * Math.sin(t * 0.5);
    ctx.save();
    ctx.globalAlpha = 0.18 * pulse;
    ctx.fillStyle = colors.moon;
    ctx.beginPath();
    ctx.arc(mx, my, r * 2.1, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = colors.moon;
    ctx.beginPath();
    ctx.arc(mx, my, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = colors.skyBottom;
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.arc(mx - 4, my - 3, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(mx + 3, my + 5, 1.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawMountains_() {
    // Cordilheira gelada ao fundo (camada mais clara/distante)
    ctx.fillStyle = colors.mountainsFar;
    for (var m = 0; m < 7; m++) {
      var mx = m * 76 - 20;
      ctx.beginPath();
      ctx.moveTo(mx, GROUND_Y);
      ctx.lineTo(mx + 38, 44 - (m % 3) * 6);
      ctx.lineTo(mx + 76, GROUND_Y);
      ctx.fill();
    }
    // Cordilheira proxima (mais escura, sobreposta)
    ctx.fillStyle = colors.mountains;
    for (var n = 0; n < 6; n++) {
      var nx = n * 92 - 10;
      ctx.beginPath();
      ctx.moveTo(nx, GROUND_Y);
      ctx.lineTo(nx + 46, 54 - (n % 2) * 8);
      ctx.lineTo(nx + 92, GROUND_Y);
      ctx.fill();
    }
  }

  function drawGround_() {
    ctx.fillStyle = colors.ground;
    ctx.fillRect(0, GROUND_Y, cssWidth, cssHeight - GROUND_Y);
    ctx.fillStyle = colors.groundLine;
    ctx.fillRect(0, GROUND_Y, cssWidth, 2);
  }

  // Yggdrasil estilizada - tronco retorcido + copa de galhos nus,
  // posicionada a direita do banner para equilibrar o titulo (esquerda).
  function drawTree_() {
    var baseX = 352, baseY = GROUND_Y;
    ctx.fillStyle = colors.silhouette;
    ctx.beginPath();
    ctx.moveTo(baseX - 7, baseY);
    ctx.quadraticCurveTo(baseX - 9, baseY - 30, baseX - 3, baseY - 54);
    ctx.quadraticCurveTo(baseX, baseY - 60, baseX + 3, baseY - 54);
    ctx.quadraticCurveTo(baseX + 9, baseY - 30, baseX + 7, baseY);
    ctx.closePath();
    ctx.fill();

    function branch(x1, y1, x2, y2, width) {
      ctx.save();
      ctx.strokeStyle = colors.silhouette;
      ctx.lineWidth = width;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.restore();
    }

    var top = baseY - 56;
    branch(baseX, top + 4, baseX - 40, top - 18, 4);
    branch(baseX - 40, top - 18, baseX - 62, top - 10, 2.5);
    branch(baseX - 40, top - 18, baseX - 58, top - 32, 2.5);
    branch(baseX, top + 2, baseX + 36, top - 22, 4);
    branch(baseX + 36, top - 22, baseX + 58, top - 14, 2.5);
    branch(baseX + 36, top - 22, baseX + 54, top - 36, 2.5);
    branch(baseX, top, baseX - 6, top - 34, 3);
    branch(baseX, top, baseX + 10, top - 30, 3);
  }

  // Pedras ruinicas simples no primeiro plano, com marcas entalhadas
  // abstratas (nao caracteres reais, so sugestao visual de runas).
  function drawRuneStones_() {
    [
      { x: 56, h: 22 },
      { x: 230, h: 18 }
    ].forEach(function (stone) {
      var w = 11;
      var topY = GROUND_Y - stone.h;
      ctx.fillStyle = colors.silhouette;
      ctx.beginPath();
      ctx.moveTo(stone.x - w / 2, GROUND_Y);
      ctx.lineTo(stone.x - w / 2 + 1, topY + 3);
      ctx.lineTo(stone.x, topY);
      ctx.lineTo(stone.x + w / 2 - 1, topY + 3);
      ctx.lineTo(stone.x + w / 2, GROUND_Y);
      ctx.closePath();
      ctx.fill();

      ctx.save();
      ctx.strokeStyle = colors.gold;
      ctx.globalAlpha = 0.55;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(stone.x, topY + 6);
      ctx.lineTo(stone.x, GROUND_Y - 4);
      ctx.moveTo(stone.x - 3, topY + 9);
      ctx.lineTo(stone.x + 3, topY + 13);
      ctx.moveTo(stone.x + 3, topY + 9);
      ctx.lineTo(stone.x - 3, topY + 13);
      ctx.stroke();
      ctx.restore();
    });
  }

  // --- 5. Loop de renderizacao (cena praticamente estatica: so estrelas
  // piscando, aurora ondulando bem devagar e um leve pulso na lua) --------
  var startTs = null;
  var lastTs = null;

  function tick_(ts) {
    if (startTs === null) startTs = ts;
    if (lastTs === null) lastTs = ts;
    var t = (ts - startTs) / 1000;
    var dt = Math.min((ts - lastTs) / 1000, 0.05);
    lastTs = ts;

    updateHero_(dt);

    drawSky_();
    drawAurora_(t);
    drawStars_(t);
    drawMoon_(t);
    drawMountains_();
    drawTree_();
    drawRuneStones_();
    drawGround_();
    drawRaven_(huginn, 316, 16, 24);
    drawRaven_(muninn, 364, 21, 20);
    drawHero_();

    requestAnimationFrame(tick_);
  }

  requestAnimationFrame(tick_);
})();
</script>

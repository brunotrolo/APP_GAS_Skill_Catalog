<div id="view-prompts" class="app-view">
  <div class="pixel-panel module-panel">
    <h2>✨ GOLDEN PROMPTS</h2>
    <p class="module-desc">Prompts validados pelo time. Use <code>{{variavel}}</code> para marcar partes a preencher antes de copiar.</p>

    <form class="module-form" onsubmit="return submitGoldenPrompt(event)">
      <input type="text" id="promptTitulo" placeholder="Titulo do prompt" required>
      <textarea id="promptTexto" placeholder="Texto do prompt (use {{variavel}} onde fizer sentido)" required></textarea>
      <input type="text" id="promptVariaveis" placeholder="Variaveis, separadas por virgula (opcional)">
      <input type="text" id="promptCategoria" placeholder="Categoria (opcional)">
      <button type="submit" class="pixel-button">+ ADICIONAR PROMPT</button>
    </form>

    <div id="promptsList" class="module-list"></div>
  </div>
</div>

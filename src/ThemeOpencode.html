<style>

       modos: canvas/surface-soft/surface-card para claro, surface-dark/
       surface-dark-elevated/on-dark para o "hero card" escuro. BRAND =
       primary/on-primary (preto/branco, #201d1d/#fdfcfc) - e literalmente
       o backgroundColor do componente button-primary (o CTA "Download" do
       arquivo) no spec; invertido entre os modos (preto no claro, branco no
       escuro) so para manter contraste legivel, nunca cor. accent #007aff
       e um toque secundario raro (reusado aqui so em --info), nao o Brand.
       warning #ff9f0a (--purple/--warn), success #30d158 (--terminal-green)
       e danger #ff3b30 continuam literais para estados/categorias, nao para
       o CTA principal. Forma: rounded.sm (4px) em todo elemento interativo,
       1px hairline, sem sombra, tudo monoespacado. */

    --cat-1: #201d1d;
    --cat-2: #302c2c;
    --cat-3: #424245;
    --cat-4: #646262;
    --cat-5: #6e6e73;
    --cat-6: #9a9898;
    --on-cat: #fdfcfc;
    --bg-deep: #201d1d;
    --bg-panel: #302c2c;

    --border-ink: #646262;
    --text-main: #fdfcfc;
    --gold: #fdfcfc;
    --gold-glow: #9a9898;
    --purple: #ff9f0a;
    --terminal-green: #30d158;
    --danger: #ff3b30;
    --muted: #9a9898;
    --info: #007aff;
    --warn: #ff9f0a;
    --gold-glow-rgb: 154, 152, 152;

    --font-heading: 'Space Mono', 'Berkeley Mono', monospace;

    --chrome-gradient-panel: var(--bg-panel);
    --chrome-gradient-success: var(--gold);

    --ambient-glow: none;
  }

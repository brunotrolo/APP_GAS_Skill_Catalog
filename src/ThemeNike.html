       Black ({colors.ink} - #111111): The brand's only 'color'... When
       Nike wants to assert anything, it goes black" + Don't explicito:
       "Don't use any of the category accent colors for primary chrome".
       Igual ao OpenCode/Figma: --gold inverte por modo so por contraste
       (branco no escuro, preto no claro), nunca um hue novo. cat-1..6 usa
       exatamente a paleta "Category Accents (sport/collection chips)" do
       arquivo - secao criada para swatch dots e chips, o uso mais literal
       possivel para nossa ladder de categorias. --terminal-green/--danger/
       --info usam success/sale/info literais (o arquivo tem os 3). Surface/
       Text escuro extrapolado reusa a propria escada de cinzas do arquivo
       (ink/charcoal/ash/mute/stone), ja um degrade pronto de 5 tons.
       Forma: rounded.lg (30px, "every CTA pill") no --radius-s/--radius-pill
       (badge-promo tambem usa rounded.lg), rounded.none (0px) nos cards -
       "zero radius, zero shadow" explicito, igual ao BMW. --shadow-chunky:
       none ("no drop-shadow elevation... cards do not lift"). Fonte:
       Nike Futura ND/Helvetica Now sao proprietarias; o proprio arquivo
       recomenda Inter como "the safest substitute" para texto de UI. */

<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

  :root {
    --bg-deep: #0f101d;
    --bg-panel: #1b1d2e;
    --bg-card: #20223a;
    --border-ink: #000000;
    --text-main: #e7e7f0;
    --gold: #ffd700;
    --purple: #9b59b6;
    --terminal-green: #00ff66;
    --danger: #ff5555;
    --muted: #8a8ca8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg-deep);
    color: var(--text-main);
    font-family: 'VT323', monospace;
    font-size: 18px;
    image-rendering: pixelated;
  }

  h1, h2, h3, .pixel-font, button, .badge {
    font-family: 'Press Start 2P', monospace;
  }

  .pixel-panel {
    background: var(--bg-panel);
    border: 4px solid var(--border-ink);
    box-shadow: 6px 6px 0px #000;
    padding: 16px;
  }

  /* ---- Top bar / search ---- */
  .search-bar {
    margin: 16px;
  }

  .search-bar h2 {
    font-size: 12px;
    color: var(--gold);
    margin: 0 0 12px 0;
  }

  .search-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-bottom: 10px;
  }

  .search-row input[type="text"],
  .search-row select {
    font-family: 'VT323', monospace;
    font-size: 18px;
    padding: 8px 10px;
    background: var(--bg-card);
    color: var(--text-main);
    border: 3px solid var(--border-ink);
    box-shadow: 3px 3px 0px #000;
  }

  .search-row input[type="text"] {
    flex: 1;
    min-width: 220px;
  }

  .tag-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .tag-pill {
    cursor: pointer;
    background: var(--bg-card);
    border: 2px solid var(--border-ink);
    color: var(--terminal-green);
    padding: 4px 8px;
    font-size: 11px;
    box-shadow: 2px 2px 0px #000;
  }

  .tag-pill.active {
    background: var(--terminal-green);
    color: #000;
  }

  .pixel-button {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    padding: 10px 14px;
    background: var(--gold);
    color: #000;
    border: 3px solid var(--border-ink);
    box-shadow: 4px 4px 0px #000;
    cursor: pointer;
  }

  .pixel-button:active {
    box-shadow: 1px 1px 0px #000;
    transform: translate(3px, 3px);
  }

  .pixel-button.secondary {
    background: var(--bg-card);
    color: var(--text-main);
  }

  .pixel-button.success {
    background: var(--terminal-green);
    color: #000;
  }

  .pixel-button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* ---- Skill grid / cards ---- */
  #skill-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
    padding: 16px;
  }

  .skill-card {
    background: var(--bg-card);
    border: 4px solid var(--border-ink);
    box-shadow: 6px 6px 0px #000;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: relative;
  }

  .skill-card .badge {
    position: absolute;
    top: -10px;
    right: -10px;
    font-size: 9px;
    padding: 6px 8px;
    border: 2px solid var(--border-ink);
    box-shadow: 2px 2px 0px #000;
  }

  .badge.interna {
    background: var(--gold);
    color: #000;
  }

  .badge.curadoria {
    background: var(--purple);
    color: #fff;
  }

  .skill-card h3 {
    font-size: 13px;
    margin: 6px 0 0 0;
    color: var(--gold);
  }

  .skill-card .meta {
    font-size: 14px;
    color: var(--muted);
  }

  .skill-card .resumo {
    font-size: 16px;
    flex: 1;
  }

  .skill-card .categoria {
    font-size: 11px;
    color: var(--terminal-green);
  }

  .skill-card .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .skill-card .tags span {
    font-size: 10px;
    background: var(--bg-panel);
    border: 1px solid var(--border-ink);
    padding: 2px 6px;
  }

  .skill-card .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 6px;
  }

  .skill-card .actions a,
  .skill-card .actions button {
    text-decoration: none;
    font-size: 10px;
  }

  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--muted);
    padding: 40px;
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
  }

  /* ---- Modal ---- */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    align-items: center;
    justify-content: center;
    z-index: 100;
  }

  .modal-overlay.open {
    display: flex;
  }

  .modal-box {
    background: var(--bg-panel);
    border: 4px solid var(--border-ink);
    box-shadow: 8px 8px 0px #000;
    padding: 20px;
    width: 90%;
    max-width: 520px;
    max-height: 85vh;
    overflow-y: auto;
  }

  .modal-box h2 {
    font-size: 13px;
    color: var(--gold);
    margin-top: 0;
  }

  .form-field {
    margin-bottom: 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .form-field label {
    font-size: 11px;
    font-family: 'Press Start 2P', monospace;
    color: var(--muted);
  }

  .form-field input[type="text"],
  .form-field textarea,
  .form-field select {
    font-family: 'VT323', monospace;
    font-size: 18px;
    padding: 8px;
    background: var(--bg-card);
    color: var(--text-main);
    border: 3px solid var(--border-ink);
  }

  .radio-group {
    display: flex;
    gap: 16px;
    font-size: 16px;
  }

  .preview-box {
    background: #000;
    color: var(--terminal-green);
    padding: 8px;
    font-family: 'VT323', monospace;
    font-size: 14px;
    word-break: break-all;
    border: 2px dashed var(--terminal-green);
  }

  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 12px 16px;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    border: 3px solid var(--border-ink);
    box-shadow: 4px 4px 0px #000;
    z-index: 200;
    display: none;
  }

  .toast.show {
    display: block;
  }

  .toast.success {
    background: var(--terminal-green);
    color: #000;
  }

  .toast.error {
    background: var(--danger);
    color: #000;
  }

  .error-text {
    color: var(--danger);
    font-size: 14px;
    min-height: 18px;
  }
</style>

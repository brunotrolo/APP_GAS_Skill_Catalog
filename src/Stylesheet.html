<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@500;700&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg-deep: #0a0b16;
    --bg-panel: #181a2c;
    --bg-card: #1d2037;
    --bg-card-hover: #262a47;
    --border-ink: #000000;
    --text-main: #f3f4fc;
    --gold: #ffd84a;
    --gold-glow: #ffe98a;
    --purple: #b06aed;
    --terminal-green: #2effa0;
    --danger: #ff5d6c;
    --muted: #b7b9d8;
    --radius-s: 6px;
    --radius-m: 10px;
  }

  :root[data-theme="light"] {
    --bg-deep: #eef0fb;
    --bg-panel: #ffffff;
    --bg-card: #f6f7ff;
    --bg-card-hover: #e9ebfb;
    --border-ink: #1b1d2e;
    --text-main: #1b1d2e;
    --gold: #c98f00;
    --gold-glow: #e8b23a;
    --purple: #8a3fd6;
    --terminal-green: #0f9d64;
    --danger: #c92a3a;
    --muted: #51546f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(176, 106, 237, 0.12), transparent 60%),
      radial-gradient(1000px 500px at 100% 0%, rgba(46, 255, 160, 0.08), transparent 55%),
      var(--bg-deep);
    color: var(--text-main);
    font-family: 'Space Mono', monospace;
    font-size: 17px;
    -webkit-font-smoothing: antialiased;
    transition: background 0.15s ease, color 0.15s ease;
  }

  canvas, img.pixel-art {
    image-rendering: pixelated;
  }

  h1, h2, h3, .pixel-font, button, .badge {
    font-family: 'Pixelify Sans', monospace;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .theme-toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'Pixelify Sans', monospace;
    font-size: 12px;
    font-weight: 700;
    padding: 9px 12px;
    background: linear-gradient(180deg, var(--bg-card-hover), var(--bg-card));
    color: var(--text-main);
    border: 2px solid var(--border-ink);
    border-radius: var(--radius-s);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.04) inset, 2px 3px 0px #000;
    cursor: pointer;
  }

  .theme-toggle:hover {
    color: var(--gold);
  }

  .theme-toggle {
    width: 100%;
    justify-content: center;
    margin-bottom: 16px;
  }

  .pixel-panel {
    background: var(--bg-panel);
    border: 2px solid var(--border-ink);
    border-radius: var(--radius-m);
    box-shadow: 0 0 0 1px rgba(255, 216, 74, 0.08), 4px 6px 0px #000, 0 12px 28px rgba(0, 0, 0, 0.45);
    padding: 16px;
  }

  /* ---- Layout (sidebar + conteudo) ---- */
  .app-layout {
    display: flex;
    align-items: flex-start;
    gap: 0;
  }

  .app-main {
    flex: 1;
    min-width: 0;
  }

  .sidebar {
    width: 220px;
    flex-shrink: 0;
    margin: 16px 0 16px 16px;
  }

  .sidebar h2 {
    font-size: 11px;
    color: var(--gold);
    margin: 0 0 10px 0;
  }

  .sidebar h2:not(:first-child) {
    margin-top: 18px;
  }

  .sidebar-nav {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .sidebar-nav li {
    font-size: 13px;
    padding: 9px 12px;
    background: linear-gradient(180deg, var(--bg-card-hover), var(--bg-card));
    border: 2px solid var(--border-ink);
    border-radius: var(--radius-s);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.04) inset, 2px 3px 0px #000;
    cursor: pointer;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }

  .sidebar-nav li:hover {
    color: var(--gold);
    transform: translate(-1px, -1px);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.04) inset, 3px 4px 0px #000;
  }

  .sidebar-nav li.active {
    background: linear-gradient(180deg, var(--gold-glow), var(--gold));
    color: #231a00;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.2) inset, 2px 3px 0px #000, 0 0 12px rgba(255, 216, 74, 0.35);
  }

  @media (max-width: 720px) {
    .app-layout {
      flex-direction: column;
    }
    .sidebar {
      width: auto;
      margin: 16px;
    }
  }

  .sidebar-tag-search {
    width: 100%;
    font-family: 'Space Mono', monospace;
    font-size: 16px;
    padding: 7px 9px;
    margin-bottom: 8px;
    background: var(--bg-card);
    color: var(--text-main);
    border: 2px solid var(--border-ink);
    border-radius: var(--radius-s);
  }

  .sidebar-tag-search:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 8px rgba(255, 216, 74, 0.3);
  }

  .sidebar-tags {
    max-height: 260px;
    overflow-y: auto;
    padding-right: 4px;
  }

  .tag-dropdown {
    position: relative;
  }

  .tag-dropdown-panel {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    z-index: 50;
    width: 280px;
    max-width: 80vw;
    background: linear-gradient(165deg, var(--bg-card-hover), var(--bg-panel) 45%);
    border: 2px solid var(--border-ink);
    border-radius: var(--radius-m);
    box-shadow: 0 0 0 1px rgba(255, 216, 74, 0.08) inset, 5px 7px 0px #000, 0 16px 30px rgba(0, 0, 0, 0.45);
    padding: 12px;
  }

  .tag-dropdown-panel.open {
    display: block;
  }

  .tag-dropdown-panel .sidebar-tag-search {
    margin-bottom: 10px;
  }

  /* ---- Top bar / search ---- */
  .search-bar {
    margin: 16px;
  }

  .search-bar h2 {
    font-size: 12px;
    color: var(--gold);
    margin: 0 0 12px 0;
  }

  .search-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-bottom: 10px;
  }

  .search-row input[type="text"],
  .search-row select {
    font-family: 'Space Mono', monospace;
    font-size: 18px;
    padding: 9px 12px;
    background: var(--bg-card);
    color: var(--text-main);
    border: 2px solid var(--border-ink);
    border-radius: var(--radius-s);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.04) inset, 3px 4px 0px #000;
  }

  .search-row input[type="text"]:focus,
  .search-row select:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.04) inset, 3px 4px 0px #000, 0 0 10px rgba(255, 216, 74, 0.3);
  }

  .search-row input[type="text"] {
    flex: 1;
    min-width: 220px;
  }

  .tag-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .tag-pill {
    cursor: pointer;
    background: var(--bg-card);
    border: 2px solid var(--border-ink);
    border-radius: 999px;
    color: var(--terminal-green);
    padding: 4px 10px;
    font-size: 11px;
    box-shadow: 2px 3px 0px #000;
    transition: transform 0.1s ease;
  }

  .tag-pill:hover {
    transform: translateY(-1px);
  }

  .tag-pill.active {
    background: var(--terminal-green);
    color: #042016;
    box-shadow: 2px 3px 0px #000, 0 0 10px rgba(46, 255, 160, 0.4);
  }

  .pixel-button {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    padding: 11px 16px;
    background: linear-gradient(180deg, var(--gold-glow), var(--gold));
    color: #231a00;
    border: 2px solid var(--border-ink);
    border-radius: var(--radius-s);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.15) inset, 3px 4px 0px #000;
    cursor: pointer;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }

  .pixel-button:hover {
    transform: translate(-1px, -1px);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.15) inset, 4px 5px 0px #000, 0 0 14px rgba(255, 216, 74, 0.3);
  }

  .pixel-button:active {
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1) inset, 1px 1px 0px #000;
    transform: translate(3px, 3px);
  }

  .pixel-button.secondary {
    background: linear-gradient(180deg, var(--bg-card-hover), var(--bg-card));
    color: var(--text-main);
  }

  .pixel-button.success {
    background: linear-gradient(180deg, #7bffc9, var(--terminal-green));
    color: #042016;
  }

  .pixel-button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none !important;
  }

  /* ---- Skill grid / cards ---- */
  #skill-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(560px, 1fr));
    gap: 18px;
    padding: 16px;
    align-items: stretch;
  }

  .skill-card {
    background: linear-gradient(165deg, var(--bg-card-hover) 0%, var(--bg-card) 40%);
    border: 2px solid var(--border-ink);
    border-radius: var(--radius-m);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.04) inset, 4px 6px 0px #000, 0 10px 22px rgba(0, 0, 0, 0.35);
    padding: 16px 14px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: relative;
    overflow: hidden;
    max-width: 100%;
    min-width: 0;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }

  .skill-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06) inset, 5px 8px 0px #000, 0 14px 28px rgba(0, 0, 0, 0.45);
  }

  .skill-card .badge {
    align-self: flex-start;
    font-size: 11px;
    padding: 6px 10px;
    border: 2px solid var(--border-ink);
    border-radius: var(--radius-s);
    box-shadow: 2px 3px 0px #000;
    max-width: 100%;
    white-space: nowrap;
  }

  .badge.interna {
    background: linear-gradient(180deg, var(--gold-glow), var(--gold));
    color: #231a00;
  }

  .badge.curadoria {
    background: linear-gradient(180deg, #d19bff, var(--purple));
    color: #230033;
  }

  .skill-card h3 {
    font-family: 'Pixelify Sans', monospace;
    font-size: 19px;
    line-height: 1.4;
    margin: 4px 0 0 0;
    color: var(--gold);
    max-width: 100%;
    overflow-wrap: break-word;
    word-break: break-word;
    hyphens: auto;
  }

  .skill-card .meta {
    font-size: 16px;
    color: var(--muted);
    overflow-wrap: break-word;
    word-break: break-word;
  }

  .skill-card .resumo {
    font-size: 18px;
    line-height: 1.4;
    flex: 1;
    overflow-wrap: break-word;
    word-break: break-word;
  }

  .categoria-badge {
    display: inline-block;
    align-self: flex-start;
    font-size: 11px;
    font-weight: 700;
    font-family: 'Pixelify Sans', monospace;
    padding: 4px 9px;
    border-radius: 999px;
    border: 1px solid var(--border-ink);
    max-width: 100%;
    overflow-wrap: break-word;
  }

  .categoria-badge.cat-1 { background: #ffd84a; color: #231a00; }
  .categoria-badge.cat-2 { background: #2effa0; color: #042016; }
  .categoria-badge.cat-3 { background: #ff5d6c; color: #2b0005; }
  .categoria-badge.cat-4 { background: #6ad1ff; color: #00222f; }
  .categoria-badge.cat-5 { background: #b06aed; color: #1f0033; }
  .categoria-badge.cat-6 { background: #ff9f5a; color: #311300; }
  .categoria-badge.cat-default { background: var(--bg-panel); color: var(--text-main); }

  .skill-card .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-width: 100%;
  }

  .skill-card .tags span {
    font-size: 13px;
    background: var(--bg-panel);
    border: 1px solid var(--border-ink);
    border-radius: 999px;
    padding: 3px 10px;
    max-width: 100%;
    overflow-wrap: break-word;
    cursor: pointer;
  }

  .skill-card .tags span:hover {
    color: var(--gold);
    border-color: var(--gold);
  }

  .skill-card .clone-count {
    font-size: 13px;
  }

  .skill-card .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 6px;
  }

  .skill-card .actions a,
  .skill-card .actions button {
    text-decoration: none;
    font-size: 12px;
    padding: 8px 10px;
  }

  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--muted);
    padding: 40px;
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
  }

  /* ---- Modal ---- */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    align-items: center;
    justify-content: center;
    z-index: 100;
  }

  .modal-overlay.open {
    display: flex;
  }

  .modal-box {
    background: linear-gradient(165deg, var(--bg-card-hover), var(--bg-panel) 45%);
    border: 2px solid var(--border-ink);
    border-radius: var(--radius-m);
    box-shadow: 0 0 0 1px rgba(255, 216, 74, 0.08) inset, 6px 8px 0px #000, 0 20px 40px rgba(0, 0, 0, 0.5);
    padding: 20px;
    width: 90%;
    max-width: 520px;
    max-height: 85vh;
    overflow-y: auto;
  }

  .modal-box h2 {
    font-size: 13px;
    color: var(--gold);
    margin-top: 0;
  }

  .form-field {
    margin-bottom: 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .form-field label {
    font-size: 11px;
    font-family: 'Press Start 2P', monospace;
    color: var(--muted);
  }

  .form-field input[type="text"],
  .form-field textarea,
  .form-field select {
    font-family: 'Space Mono', monospace;
    font-size: 18px;
    padding: 9px;
    background: var(--bg-card);
    color: var(--text-main);
    border: 2px solid var(--border-ink);
    border-radius: var(--radius-s);
  }

  .form-field input[type="text"]:focus,
  .form-field textarea:focus,
  .form-field select:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 10px rgba(255, 216, 74, 0.3);
  }

  .radio-group {
    display: flex;
    gap: 16px;
    font-size: 16px;
  }

  .preview-box {
    background: #050608;
    color: var(--terminal-green);
    padding: 10px;
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    word-break: break-all;
    border: 2px dashed var(--terminal-green);
    border-radius: var(--radius-s);
  }

  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 12px 16px;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    border: 2px solid var(--border-ink);
    border-radius: var(--radius-s);
    box-shadow: 4px 5px 0px #000, 0 10px 24px rgba(0, 0, 0, 0.4);
    z-index: 200;
    display: none;
  }

  .toast.show {
    display: block;
  }

  .toast.success {
    background: var(--terminal-green);
    color: #000;
  }

  .toast.error {
    background: var(--danger);
    color: #000;
  }

  .error-text {
    color: var(--danger);
    font-size: 14px;
    min-height: 18px;
  }
</style>

<div id="view-radar" class="app-view">
  <div class="pixel-panel module-panel">
    <h2>📡 COMMUNITY RADAR</h2>
    <p class="module-desc">Sinalize ferramentas OSS em alta que ainda nao estao no catalogo. Vote nas que mais interessam.</p>

    <form class="module-form" onsubmit="return submitRadarItem(event)">
      <input type="text" id="radarNome" placeholder="Nome da ferramenta" required>
      <input type="text" id="radarUrl" placeholder="URL (GitHub, site, etc.)" required>
      <input type="text" id="radarDescricao" placeholder="Por que vale a pena? (opcional)">
      <button type="submit" class="pixel-button">+ SUGERIR FERRAMENTA</button>
    </form>

    <div id="radarList" class="module-list"></div>
  </div>
</div>

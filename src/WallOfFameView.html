<div id="view-fame" class="app-view">
  <div class="pixel-panel module-panel">
    <h2>🏆 HALL DA FAMA</h2>
    <p class="module-desc">Registre o impacto real de uma skill: quem usou e o que ela resolveu.</p>

    <form class="module-form" onsubmit="return submitFameEntry(event)">
      <input type="text" id="fameSkillNome" placeholder="Nome da skill" required>
      <input type="text" id="fameTime" placeholder="Time/squad (opcional)">
      <input type="text" id="fameImpacto" placeholder="Qual foi o impacto?" required>
      <button type="submit" class="pixel-button">+ REGISTRAR IMPACTO</button>
    </form>

    <div id="fameList" class="module-list"></div>
  </div>
</div>

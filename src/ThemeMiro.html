       "Don't use brand-yellow on standard CTAs or large background
       surfaces... reserve for wordmark/promo-banner/tag-chips only".

       e o amarelo fica de fora do Brand generico, usado apenas e
       estritamente em --warn. O modo escuro usa footer-bg (#1c1c1e,

       laranja-claro/azul/verde) - descrita no proprio arquivo como
       "echo the actual sticky-note color palette used on the live
       whiteboard", encaixe literal perfeito para tags/categorias.
       --terminal-green=success-accent (literal). --danger usa coral-dark
       (#600000, literalmente "coral-tag text color", o vermelho mais
       forte disponivel). Forma: rounded.full (9999px) em botoes/badges,

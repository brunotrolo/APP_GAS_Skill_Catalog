<div id="view-oracle" class="app-view">
  <div class="pixel-panel module-panel">
    <h2>🔮 ORACULO SEMANAL</h2>
    <p class="module-desc">Artigos e novidades de IA/engenharia selecionados pelo time (curadoria manual por enquanto).</p>

    <form class="module-form" onsubmit="return submitOracleItem(event)">
      <input type="text" id="oracleTitulo" placeholder="Titulo do artigo" required>
      <input type="text" id="oracleUrl" placeholder="URL" required>
      <input type="text" id="oracleFonte" placeholder="Fonte (opcional)">
      <input type="text" id="oracleResumo" placeholder="Resumo curto (opcional)">
      <button type="submit" class="pixel-button">+ ADICIONAR ACHADO</button>
    </form>

    <div id="oracleList" class="module-list"></div>
  </div>
</div>

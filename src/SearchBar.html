<div class="search-bar pixel-panel">
  <h2>BUSCAR NO INVENTARIO</h2>
  <div class="search-row">
    <input type="text" id="searchBox" placeholder="Nome, autor, tag ou resumo..." oninput="applyFilters()">
    <select id="categoryFilter" onchange="applyFilters()">
      <option value="ALL">TODAS AS CLASSES</option>
    </select>

    <div class="tag-dropdown" id="tagDropdown">
      <button type="button" class="pixel-button secondary" onclick="toggleDropdown('tagDropdown')" id="tagDropdownToggle">🏷️ TAGS</button>
      <div class="tag-dropdown-panel" id="tagDropdownPanel">
        <input type="text" id="tagSearchBox" class="sidebar-tag-search" placeholder="Buscar tag..." oninput="renderTagPills()">
        <div class="tag-pills sidebar-tags" id="tagPills"></div>
      </div>
    </div>

    <div class="tag-dropdown" id="sortDropdown">
      <button type="button" class="pixel-button secondary" onclick="toggleDropdown('sortDropdown')" id="sortDropdownToggle">↕️ ORDENAR</button>
      <div class="tag-dropdown-panel" id="sortDropdownPanel">
        <ul class="sidebar-nav" id="sortNav">
          <li data-sort="nome_asc" class="active">NOME (A-Z)</li>
          <li data-sort="nome_desc">NOME (Z-A)</li>
          <li data-sort="data_desc">MAIS RECENTES</li>
          <li data-sort="data_asc">MAIS ANTIGOS</li>
          <li data-sort="autor_asc">AUTOR (A-Z)</li>
        </ul>
      </div>
    </div>

    <button class="pixel-button" onclick="openRegisterModal()">+ CADASTRAR SKILL</button>
  </div>
</div>

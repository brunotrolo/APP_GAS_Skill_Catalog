<style>
  /* De docs/themes/DESIGN-nintendo-2001.md. O arquivo estratifica o
       calor em papeis bem separados: Nintendo Red e so logo ("never a
       surface fill outside the logo plate"), nav-gold e so palavras de
       nav, amber e "utility energy" (literalmente o bg de button-primary)
       e signal e "the commit action" (bg de button-submit, "if something
       advances you, it is orange"). Brand (--gold) segue a regra padrao
       (literal button-primary.backgroundColor) = Amber #ecab37, com
       --gold-glow = nav-gold #e48600 (literalmente o proprio
       button-primary-pressed). --info guarda Signal #f68d1f e
       --chrome-gradient-success usa --info em vez de --gold - mesmo
       padrao do Meta/PlayStation: o botao "BAIXAR .ZIP" e a acao de
       commit/avanco do app, o papel exato do Signal Orange, nao do
       Amber generico de utilidades. cat-1..6 evita Nintendo Red (restrito
       a logo) e reusa a familia fria (teal/games-red/lavender/indigo/
       periwinkle) - paleta "accent tint" das heros, legitima para
       swatches. --danger usa error (literal, "reuse the brand red" - a
       unica excecao documentada ao uso do vermelho fora do logo).
       radius-pill NAO e pill: o proprio arquivo diz "roundness only
       where it signals a physical control" - esrb-badge, o badge de
       texto mais proximo do nosso, usa os mesmos 2px de botoes, nao
       rounded.full. --heading-transform: uppercase + tracking 0.5px -
       "every structural label is uppercase Arial Bold... the silkscreen-
       legend voice". --shadow-chunky: none (Don't explicito "no soft
       blurred drop-shadow... not Material elevation"). Fonte: Arial, web-
       safe, sem substituto necessario. */

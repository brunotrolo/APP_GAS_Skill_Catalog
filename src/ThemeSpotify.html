       os 4 semanticos existem literalmente no arquivo (negative red
       #f3727f, warning orange #ffa42b, announcement blue #539df5) - raro
       nao precisar reusar nada. cat-6 reusa light-border/muted-link #7c7c7c

       instead") - por isso --border-ink fica bem proximo do proprio fundo
       do card, quase invisivel, e --shadow-chunky usa a sombra "Medium"
       pesada (0.3 opacidade) que o arquivo pede no lugar de bordas finas.
       O modo claro so tem UMA excecao documentada ("Light Pill": bg
       #eeeeee, texto #181818) - usada aqui como base do Surface/Text
       claro extrapolado; Brand nao muda. Fonte: SpotifyMixUI/CircularSp
       sao proprietarias, sem substituto explicito no arquivo - usa a
       mesma familia neutra de sistema (Helvetica Neue, citada na propria
       pilha de fallback do arquivo) que ja usamos noutros temas sem fonte

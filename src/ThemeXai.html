<style>
  /* De docs/themes/DESIGN-x.ai.md. Brand = branco #ffffff (literal bg do
       button-primary), neutro - inverte por modo (branco no escuro, preto
       quase puro #0a0a0a no claro), igual OpenCode/Figma/Nike/Uber. O
       proprio arquivo diz "Don't introduce a light-mode counterpart. xAI
       is dark-canvas only" - o modo claro abaixo existe so porque o motor
       de temas do app exige os dois eixos (Tema x Tipo) para toda familia;
       e Surface/Text extrapolados (nunca Brand), igual ja feito para o
       modo claro do BMW quando o arquivo so documentava um canvas escuro.
       cat-1..6 usa os 6 acentos "accent-*" literais do arquivo (sunset/
       sunset-soft/dusk/twilight/breeze/midnight) - descritos como
       "reserved for product illustrations/icons", nao proibidos de UI
       geral como os casos Mastercard/Binance, so raros no chrome
       principal; papel de categoria/tag combina bem com "icones
       ilustrativos". --purple usa accent-dusk (roxo real, literal).
       Forma: rounded.pill (9999px, "the pill is the brand") em botoes/
       badges, rounded.sm (8px, "the brand's --radius value") em cards.
       --shadow-chunky: none ("uses no shadows. Hairline borders carry
       all elevation"). Fonte: universalSans e proprietaria; substituto
       literal do proprio arquivo e Inter. */
  :root[data-theme-family="xai"][data-theme="dark"] {
    --cat-1: #ff7a17;
    --cat-2: #ffc285;
    --cat-3: #7c3aed;
    --cat-4: #c4b5fd;
    --cat-5: #a0c3ec;
    --cat-6: #0d1726;
    --on-cat: #ffffff;
    --bg-deep: #0a0a0a;
    --bg-panel: #1a1c20;
    --bg-card: #191919;
    --bg-card-hover: #363a3f;
    --border-ink: #212327;
    --text-main: #ffffff;
    --gold: #ffffff;
    --gold-glow: #363a3f;
    --purple: #7c3aed;
    --terminal-green: #7d8187;
    --danger: #ff7a17;
    --muted: #7d8187;
    --info: #a0c3ec;
    --warn: #ffc285;
    --gold-glow-rgb: 54, 58, 63;
    --terminal-green-rgb: 125, 129, 135;
    --font-heading: 'Inter', system-ui, -apple-system, sans-serif;
    --font-body: 'Inter', system-ui, -apple-system, sans-serif;
    --font-display: 'Inter', system-ui, -apple-system, sans-serif;
    --radius-s: 9999px;
    --radius-m: 8px;
    --radius-pill: 9999px;
    --border-width: 1px;
    --shadow-chunky: none;
    --letter-spacing-heading: -0.6px;
    --heading-transform: none;
    --on-accent: #0a0a0a;
    --chrome-gradient: var(--bg-card);
    --chrome-gradient-accent: var(--gold);
    --chrome-gradient-card: var(--bg-card);
    --chrome-gradient-panel: var(--bg-panel);
    --chrome-gradient-success: var(--gold);
    --chrome-gradient-curadoria: var(--purple);
    --ambient-glow: none;
  }

  :root[data-theme-family="xai"][data-theme="light"] {
    --cat-1: #ff7a17;
    --cat-2: #ffc285;
    --cat-3: #7c3aed;
    --cat-4: #c4b5fd;
    --cat-5: #a0c3ec;
    --cat-6: #0d1726;
    --on-cat: #ffffff;
    --bg-deep: #ffffff;
    --bg-panel: #f5f5f5;
    --bg-card: #efefef;
    --bg-card-hover: #e5e5e5;
    --border-ink: #dcdcdc;
    --text-main: #0a0a0a;
    --gold: #0a0a0a;
    --gold-glow: #7d8187;
    --purple: #7c3aed;
    --terminal-green: #7d8187;
    --danger: #ff7a17;
    --muted: #7d8187;
    --info: #a0c3ec;
    --warn: #ffc285;
    --gold-glow-rgb: 125, 129, 135;
    --terminal-green-rgb: 125, 129, 135;
    --font-heading: 'Inter', system-ui, -apple-system, sans-serif;
    --font-body: 'Inter', system-ui, -apple-system, sans-serif;
    --font-display: 'Inter', system-ui, -apple-system, sans-serif;
    --radius-s: 9999px;
    --radius-m: 8px;
    --radius-pill: 9999px;
    --border-width: 1px;
    --shadow-chunky: none;
    --letter-spacing-heading: -0.6px;
    --heading-transform: none;
    --on-accent: #ffffff;
    --chrome-gradient: var(--bg-card);
    --chrome-gradient-accent: var(--gold);
    --chrome-gradient-card: var(--bg-card);
    --chrome-gradient-panel: var(--bg-panel);
    --chrome-gradient-success: var(--gold);
    --chrome-gradient-curadoria: var(--purple);
    --ambient-glow: none;
  }
</style>
